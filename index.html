<style>
  /* ANIMASI MODERN */
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } }
  @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .slide-left { animation: slideLeft 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  @keyframes pageEnter { 
    from { opacity: 0; transform: translateY(30px) scale(0.98); } 
    to { opacity: 1; transform: translateY(0) scale(1); } 
  }
  @keyframes popIn { 
    0% { opacity: 0; transform: scale(0.9); } 
    100% { opacity: 1; transform: scale(1); } 
  }
  
  .anim-fade { animation: fadeIn 0.3s ease-out forwards; }
  .anim-slideup { animation: slideUp 0.4s cubic-bezier(0.22,1,0.36,1) forwards; }
  .anim-page-enter { animation: pageEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .anim-popin { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

.no-anim .anim-slideup, .no-anim .anim-page-enter, .no-anim .anim-fade { animation: none !important; }

// --- FUNGSI NAVIGASI TAB WORKSPACE ---
window.switchWorkspaceTab = function(tabName) {
  const tabs = ['notulensi', 'absensi', 'dokumentasi'];
  const colors = { notulensi: 'blue', absensi: 'emerald', dokumentasi: 'purple' };

  tabs.forEach(t => {
    const pane = document.getElementById('ws-tab-' + t);
    const btn = document.getElementById('ws-btn-' + t);
    if (!pane || !btn) return;

    if (t === tabName) {
      // Fade In Pane
      pane.classList.remove('opacity-0', 'z-0', 'pointer-events-none');
      pane.classList.add('opacity-100', 'z-10');
      // Set Active Button Colors
      const c = colors[t];
      btn.className = `shrink-0 md:shrink w-auto md:w-full flex items-center p-3 rounded-xl transition-all bg-${c}-50 border-${c}-200 border text-${c}-700 shadow-sm`;
      btn.querySelector('.ws-icon-bg').className = `ws-icon-bg p-2 rounded-lg mr-3 bg-${c}-500 text-white`;
    } else {
      // Fade Out Pane
      pane.classList.remove('opacity-100', 'z-10');
      pane.classList.add('opacity-0', 'z-0', 'pointer-events-none');
      // Set Inactive Button Colors
      btn.className = `shrink-0 md:shrink w-auto md:w-full flex items-center p-3 rounded-xl transition-all bg-transparent border border-transparent text-gray-600 hover:bg-gray-50`;
      btn.querySelector('.ws-icon-bg').className = `ws-icon-bg p-2 rounded-lg mr-3 bg-gray-100 text-gray-500`;
    }
  });
};

window.submitAbsensi = async function(e, id) {
  e.preventDefault();
  const s = schedules.find(x => x.id === id);
  if (s) {
    const checkboxes = document.querySelectorAll('.absensi-cb:checked');
    s.hadir = Array.from(checkboxes).map(cb => cb.value);
    await window.set(window.ref(window.rtdb, "gaspol_schedules/" + id), s);
    alert('Data absensi peserta berhasil disimpan!');
    closeModal();
  }
  return false;
};

// 0 = Direktur Utama, 1 = Direktur, 2 = Manajer, 3 = Asisten Manajer, 4 = lainnya
window.jabatanRank = function(u) {
  const j = String((u && u.jabatan) || '').toLowerCase();
  if (/direktur utama/.test(j) || (u && u.divisi === 'Direktur Utama')) return 0;
  if (/^direktur/.test(j)) return 1;
  if (/^asisten manajer/.test(j)) return 3;
  if (/^manajer/.test(j)) return 2;
  return 4;
};

// Urut: jabatan tertinggi, lalu urutan divisi; tamu luar di paling bawah
window.sortAbsensi = function(names) {
  const ord = (typeof DIVISI_ORDER !== 'undefined') ? DIVISI_ORDER : DIVISIONS;
  const keyed = (names || []).map((n, i) => {
    const u = USERS.find(x => x.name === n);
    const d = u ? ord.indexOf(u.divisi) : -1;
    return { n, i, known: !!u, r: u ? jabatanRank(u) : 99, d: d < 0 ? 99 : d };
  });
  keyed.sort((a, b) => (a.known === b.known ? 0 : a.known ? -1 : 1) || a.r - b.r || a.d - b.d || a.i - b.i);
  return keyed.map(k => k.n);
};

// Daftar user yang boleh dipilih lewat "Pilih Semua"
window.getAbsensiPool = function(scheduleId) {
  const s = schedules.find(x => x.id === scheduleId);
  let pool = USERS.filter(u => DIVISIONS.includes(u.divisi) || (!isLiteAdmin() && jabatanRank(u) === 0));
  if (isLiteAdmin()) {
    const allowed = new Set([...(getScopeDivisi() || []), ...((s && s.divisi) || [])]);
    pool = pool.filter(u => allowed.has(u.divisi));
  }
  return pool;
};

window.toggleSelectAllAbsensi = function(cb) {
  const pool = getAbsensiPool(cb.dataset.sid);
  if (cb.checked) {
    pool.forEach(u => { if (!window.tempAbsensi.includes(u.name)) window.tempAbsensi.push(u.name); });
  } else {
    const names = new Set(pool.map(u => u.name));
    window.tempAbsensi = window.tempAbsensi.filter(n => !names.has(n));
  }
  renderAbsensiList();
};

window.renderAbsensiList = function() {
  window.tempAbsensi = sortAbsensi(window.tempAbsensi);
  // sinkronkan status checkbox "Pilih Semua"
  const allCb = document.getElementById('absensi-select-all');
  if (allCb) {
    const pool = getAbsensiPool(allCb.dataset.sid);
    allCb.checked = pool.length > 0 && pool.every(u => window.tempAbsensi.includes(u.name));
  }

  const container = document.getElementById('absensi-list');
  if (!container) return;

  if (window.tempAbsensi.length === 0) {
    container.innerHTML = '<p class="text-sm text-gray-400 italic w-full text-center py-6">Belum ada peserta yang diabsen.</p>';
    return;
  }

  container.innerHTML = window.tempAbsensi.map(name => `
    <div class="flex items-center gap-2 bg-white border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg shadow-sm text-sm font-bold">
      ${name}
      <button onclick="removeTempAbsensi('${name}')" class="text-emerald-400 hover:text-rose-500 transition-colors ml-1 p-0.5 rounded-full hover:bg-rose-50">${icon('x', 'w-3.5 h-3.5')}</button>
    </div>
  `).join('');
  refreshIcons();
};

window.removeTempAbsensi = function(name) {
  window.tempAbsensi = window.tempAbsensi.filter(n => n !== name);
  renderAbsensiList();
};

window.addTempAbsensi = function(name) {
  if(name && !window.tempAbsensi.includes(name)) {
    window.tempAbsensi.push(name);
    renderAbsensiList();
  }
  document.getElementById('absensi-search').value = '';
  document.getElementById('absensi-search-results').classList.add('hidden');
};

window.searchAbsensi = function(e, scheduleId) {
  const val = e.target.value.toLowerCase().trim();
  const resContainer = document.getElementById('absensi-search-results');
  if(!val) { resContainer.classList.add('hidden'); return; }

  // Cocokkan data user di sistem (batas 5 hasil teratas yang belum diabsen)
  const matches = USERS.filter(u => u.name.toLowerCase().includes(val) && !window.tempAbsensi.includes(u.name)).slice(0, 5);

  let html = matches.map(u => `
    <div class="p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 flex flex-col" onclick="addTempAbsensi('${u.name}')">
      <span class="font-bold text-gray-800 text-sm">${u.name}</span>
      <!-- Tadi u.divisi, sekarang diubah jadi u.jabatan -->
      <span class="text-[10px] text-gray-500">${u.jabatan}</span> 
    </div>
  `).join('');

  // Tombol tambah tamu manual (Bebas ketik di luar sistem)
  html += `
    <div class="p-3 bg-blue-50 hover:bg-blue-100 cursor-pointer text-blue-700 text-sm font-bold flex items-center gap-2 transition-colors" onclick="addTempAbsensi('${e.target.value.trim()}')">
      ${icon('plus-circle', 'w-4 h-4')} Tambah "${e.target.value.trim()}" (Tamu Luar)
    </div>
  `;

  resContainer.innerHTML = html;
  resContainer.classList.remove('hidden');
  refreshIcons();

  if(e.key === 'Enter') {
    addTempAbsensi(e.target.value.trim());
  }
};
// --- Fungsi Navigasi Tab dalam Workspace ---
window.changeWorkspaceTab = function(scheduleId, tab) {
  const s = schedules.find(x => x.id === scheduleId);
  if (s) {
    if (tab === 'absensi') { 
      // Reset draft agar murni sesuai kondisi DB setiap kali tab dibuka
      window.tempAbsensi = [...(s.hadir || [])]; 
    }
    openModal('scheduleWorkspace', { schedule: s, activeTab: tab });
  }
};

// --- FUNGSI RENDER & UPLOAD DOKUMENTASI SEMENTARA ---
window.renderWorkspaceDokumentasi = function(isAdmin, scheduleId) {
  const container = document.getElementById('ws-dok-container');
  if(!container) return;
  const docs = window.tempDokumentasi || [];
  
  let html = docs.map((imgBase64, idx) => `
    <div class="relative group cursor-pointer" onclick="openModal('imagePreview', '${imgBase64}')">
      <img src="${imgBase64}" class="w-32 h-32 md:w-48 md:h-48 object-cover rounded-xl border border-gray-200 shadow-sm hover:scale-105 transition-transform" />
      ${isAdmin ? `<button onclick="event.stopPropagation(); hapusDokumentasiWorkspace('${scheduleId}',${idx})" class="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full p-1.5 opacity-0 group-hover:opacity-100 transition-opacity shadow-md" title="Hapus Foto">${icon('x', 'w-4 h-4')}</button>` : ''}
    </div>
  `).join('');
  
  if (isAdmin && docs.length < 2) {
    html += `
    <label 
      ondragover="event.preventDefault(); this.classList.add('border-purple-500', 'bg-purple-50', 'text-purple-600')"
      ondragleave="event.preventDefault(); this.classList.remove('border-purple-500', 'bg-purple-50', 'text-purple-600')"
      ondrop="event.preventDefault(); this.classList.remove('border-purple-500', 'bg-purple-50', 'text-purple-600'); handleDropDokumentasi(event, '${scheduleId}')"
      class="w-32 h-32 md:w-48 md:h-48 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-purple-400 hover:bg-purple-50 hover:text-purple-500 transition-all text-gray-400">
      ${icon('upload-cloud', 'w-8 h-8')}
      <span class="text-xs font-bold mt-2">Upload/Drag Foto</span>
      <input type="file" accept="image/*" class="hidden" onchange="handleUploadDokumentasiWorkspace(this, '${scheduleId}')" />
    </label>`;
  }
  window.handleDropDokumentasi = function(e, scheduleId) {
    if(e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleUploadDokumentasiWorkspace({ files: e.dataTransfer.files }, scheduleId);
    }
};
  container.innerHTML = html;
  const counter = document.getElementById('ws-dok-counter');
  if(counter) counter.innerText = docs.length + ' / 2';
  refreshIcons();
};

window.handleUploadDokumentasiWorkspace = async function(input, scheduleId) {
  if(input.files && input.files[0]) {
    if(window.tempDokumentasi.length >= 2) return alert('Maksimal hanya 2 foto!');
    
    // Tampilkan notifikasi kompresi
    const toastContainer = document.getElementById('toast-container');
    if(toastContainer) alert("Sedang memproses dan mengompres foto...");

    try {
      // 1. Lakukan kompresi file otomatis (Maksimal 1280px, Kualitas 70%)
      const compressedFile = await window.compressImage(input.files[0], 1280, 1280, 0.7);
      
      // 2. Siapkan file yang sudah dikompres untuk diupload
      const formData = new FormData();
      formData.append("file", compressedFile);

window.compressImage = function(file, maxWidth = 1280, maxHeight = 1280, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width;
        let height = img.height;

        // Hitung rasio untuk memperkecil ukuran jika melebihi batas maksimal
        if (width > height) {
          if (width > maxWidth) {
            height = Math.round(height * (maxWidth / width));
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round(width * (maxHeight / height));
            height = maxHeight;
          }
        }

        // Gambar ulang ke dalam canvas dengan ukuran baru
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Convert canvas kembali menjadi file Blob/JPG
        canvas.toBlob((blob) => {
          const newFile = new File([blob], file.name, {
            type: 'image/jpeg',
            lastModified: Date.now()
          });
          resolve(newFile);
        }, 'image/jpeg', quality);
      };
      img.onerror = error => reject(error);
    };
    reader.onerror = error => reject(error);
  });
};

function getDivisionStats(taskList){
  const stats = {};
  
  // 1. Siapkan wadah kosong untuk Divisi
  DIVISIONS.forEach(d => { 
    stats[d] = { total:0, done:0, onTime:0, onProgress:0, overdue:0, tasks:[], type:'divisi', completionRate:0, onTimeRate:0, score:0 }; 
  });
  
  // 2. Siapkan wadah kosong untuk Direktorat
  Object.keys(HIERARCHY).forEach(dir => { 
    stats[dir] = { total:0, done:0, onTime:0, onProgress:0, overdue:0, tasks:[], type:'direktorat', completionRate:0, onTimeRate:0, score:0, subs: HIERARCHY[dir] }; 
  });

  // 3. Masukkan data tugas per Divisi
  taskList.forEach(t => {
    t.divisi.forEach(d => {
      if(!stats[d] || stats[d].type === 'direktorat') return; 
      
      stats[d].total++;
      stats[d].tasks.push(t);
      
      if(t.done) { 
        stats[d].done++; 
        // Jika selesai tepat waktu/sebelum deadline
        if(t.doneDate && t.doneDate <= t.deadline) {
          stats[d].onTime++; 
        } else {
          // Jika selesai tapi telat
          stats[d].overdue++; 
        }
      } else {
        // Jika belum selesai, cek apakah sudah lewat deadline?
        if (daysDiff(t.deadline) < 0) {
          stats[d].overdue++; 
        } else {
          stats[d].onProgress++;
        }
      }
    });
  });

  // 4. Hitung persentase murni untuk Divisi
  DIVISIONS.forEach(d => {
    if(stats[d].type === 'divisi' && stats[d].total > 0) {
      stats[d].completionRate = Math.round((stats[d].done / stats[d].total) * 100);
      stats[d].onTimeRate = Math.round((stats[d].onTime / stats[d].total) * 100);
      stats[d].score = Math.round((stats[d].completionRate + stats[d].onTimeRate) / 2);
    }
  });

  // 5. Gabungkan data ke Direktorat (Penjumlahan total tugas nyata)
  Object.keys(HIERARCHY).forEach(dir => {
    if(!stats[dir]) return;
    const subDivs = HIERARCHY[dir];
    
    subDivs.forEach(sub => {
      if(stats[sub]) { 
        stats[dir].total += stats[sub].total; 
        stats[dir].done += stats[sub].done;
        stats[dir].onTime += stats[sub].onTime; 
        stats[dir].onProgress += stats[sub].onProgress; 
        stats[dir].overdue += stats[sub].overdue;
        stats[dir].tasks.push(...stats[sub].tasks);
      }
    });
    
    // 6. Hitung persentase untuk Direktorat dari angka gabungan tersebut
    if(stats[dir].total > 0) {
      stats[dir].completionRate = Math.round((stats[dir].done / stats[dir].total) * 100);
      stats[dir].onTimeRate = Math.round((stats[dir].onTime / stats[dir].total) * 100);
      stats[dir].score = Math.round((stats[dir].completionRate + stats[dir].onTimeRate) / 2);
    }
  });

  return Object.keys(stats).map(d => ({ divisi: d, ...stats[d] }));
}

  if (!cu || cu.role !== 'admin' || !cu.scopeDirektorat) return null;
  return [cu.scopeDirektorat, ...(HIERARCHY[cu.scopeDirektorat] || [])];
};


// Saring tugas & agenda sesuai scope
window.applyScopeFilter = function() {
  const sc = window.getScopeDivisi();
  const f = list => sc ? list.filter(x => (x.divisi || []).some(d => sc.includes(d))) : list;
  window.tasks = f(window._rawTasks || []);
  window.schedules = f(window._rawSchedules || []);
};

/* ===== CAKUPAN TAMPILAN USER (Direktur = direktorat + divisi bawahannya) ===== */
window.getViewDivisi = function(cu) {
  cu = cu || window.state.currentUser;
  if (cu && HIERARCHY[cu.divisi]) return [cu.divisi, ...HIERARCHY[cu.divisi]];
  return [cu ? cu.divisi : ''];
};
window.inMyScope = list => (window.isDirut(window.state.currentUser) || window.state.currentUser.role === 'admin')
  ? true
  : (list || []).some(d => window.getViewDivisi().includes(d));
window.scopedTasks = () => (state.currentUser.role === 'admin' || window.isDirut(state.currentUser)) ? tasks : tasks.filter(t => inMyScope(t.divisi));
window.isAsmen = cu => /^asisten manajer/i.test(((cu || {}).jabatan) || '');

// Cocokkan nama tanpa gelar (aman jika gelar diubah di Edit Profil)
window.iAmIn = list => {
  const me = parseName(state.currentUser.name).name.toLowerCase();
  return (list || []).some(n => parseName(n).name.toLowerCase() === me);
};

// Khusus Home: asmen hanya melihat yang ada namanya
window.homeTasks = () => scopedTasks().filter(t => !isAsmen(state.currentUser) || iAmIn(t.pic));
window.homeSchedules = () => schedules.filter(s => inMyScope(s.divisi) && (!isAsmen(state.currentUser) || iAmIn(s.users)));
/* ===== HAK AKSES AGENDA (berbasis pembuat) ===== */
window.isFullAdmin = function() {
  const cu = window.state && window.state.currentUser;
  return !!(cu && cu.role === 'admin' && !cu.scopeDirektorat);
};
window.getScheduleCreator = function(s) {
  return (window.USERS || []).find(u => u.id === s.createdBy) || null;
};
// Agenda Direksi = dibuat Sekretaris Direksi / Master Admin / agenda lama tanpa createdBy
window.isDirutAgenda = function(s) {
  const c = window.getScheduleCreator(s);
  return !c || !c.scopeDirektorat;
};
window.isScheduleOwner = function(s) {
  const cu = window.state && window.state.currentUser;
  if (!cu || cu.role !== 'admin' || !s) return false;
    if (cu.jabatan === 'Master Admin' || cu.jabatan === 'Plh.Direktur Utama') return true;   // akses penuh
  if (s.createdBy) return s.createdBy === cu.id;
  return cu.jabatan === 'Sekretaris Direksi';               // agenda lama
};
// Notulensi: pembuat agenda, ATAU semua admin (termasuk Sekretaris Direktorat) jika agendanya dibuat Sekretaris Direktur Utama
window.canEditNotulensi = s => window.isScheduleOwner(s) ||

// Penanda per dokumen dinonaktifkan (diganti label per paragraf). Dibiarkan agar kode lain tidak error.

function statusChip(status, styleMap){ return `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold ${styleMap[status].chip || styleMap[status]}">${status}</span>`; }
function chipSelectHtml(options, selectedSet, groupName){
  return `<div class="flex flex-wrap gap-2" id="chipgroup-${groupName}">` +
    options.map(opt => `<button type="button" class="px-3 py-1.5 text-xs font-semibold rounded-full border border-gray-200 transition-all ${selectedSet.has(opt)?'bg-evergreen-light/50 border-evergreen text-evergreen-dark':'bg-white text-gray-500 hover:border-evergreen hover:text-evergreen-dark'}" onclick="toggleChip('${groupName}','${opt.replace(/'/g,"\\'")}')">${opt}</button>`).join('') +
    `</div>`;
}
window.toggleChip = function(groupName, value){
  const setMap = { addTaskDivisi: state.addTaskDivisi, addTaskPic: state.addTaskPic, addScheduleDivisi: state.addScheduleDivisi, addScheduleUsers: state.addScheduleUsers };
  const set = setMap[groupName];
  if(set.has(value)) set.delete(value); else set.add(value);
  const el = document.getElementById('chipgroup-'+groupName);
  if(!el) return;
  const options = Array.from(el.children).map(b => b.textContent);
  el.outerHTML = chipSelectHtml(options, set, groupName);
  refreshIcons();
  if(groupName === 'addTaskDivisi') refreshPicOptions();
};
function refreshPicOptions(){
  const wrap = document.getElementById('addtask-pic-wrap');
  if(!wrap) return;
  const eligible = USERS.filter(u => state.addTaskDivisi.size===0 || state.addTaskDivisi.has(u.divisi)).map(u=>u.name);
  state.addTaskPic = new Set(Array.from(state.addTaskPic).filter(p => eligible.includes(p)));
  wrap.innerHTML = chipSelectHtml(eligible, state.addTaskPic, 'addTaskPic');
  refreshIcons();
}

window.toggleDivisiCheckbox = function(cb) {
  if (cb.checked) { state.addScheduleDivisi.add(cb.value); } else { state.addScheduleDivisi.delete(cb.value); }
  const selectAllCb = document.getElementById('cb-select-all');
  if (selectAllCb) { selectAllCb.checked = state.addScheduleDivisi.size === DIVISIONS.length; }
  updateDivisiSelectedText();
};
window.toggleAllDivisi = function(cb) {
  const checkboxes = document.querySelectorAll('.divisi-cb');
  if (cb.checked) {
    allDivOptions().forEach(d => {
      state.addScheduleDivisi.add(d);
      USERS.filter(u => u.divisi === d).forEach(u => state.addScheduleUsers.add(u.id));
    });
    checkboxes.forEach(c => c.checked = true);
  } else {
    state.addScheduleDivisi.clear();
    state.addScheduleUsers.clear();
    checkboxes.forEach(c => c.checked = false);
  }
  renderPesertaCheckboxes();
};

window.handleDivisiCheck = function(cb) {
  const div = cb.value;
  const selectAllCb = document.getElementById('cb-select-all');

  if (cb.checked) {
    state.addScheduleDivisi.add(div);
    USERS.filter(u => u.divisi === div).forEach(u => state.addScheduleUsers.add(u.id));
    
    // Jika semua divisi dicentang satu per satu, otomatis centang "Pilih Semua"
    if (selectAllCb && state.addScheduleDivisi.size === DIVISIONS.length) {
      selectAllCb.checked = true;
    }
  } else {
    state.addScheduleDivisi.delete(div);
    USERS.filter(u => u.divisi === div).forEach(u => state.addScheduleUsers.delete(u.id));
    
    // Jika ada satu yang di-uncheck, hilangkan centang "Pilih Semua"
    if (selectAllCb && state.addScheduleDivisi.size === allDivOptions().length) {
      selectAllCb.checked = false;
    }
  }
  renderPesertaCheckboxes(); 
};
window.renderPesertaCheckboxes = function() {
  const container = document.getElementById('peserta-container');
  if (state.addScheduleDivisi.size === 0) {
    container.innerHTML = 'Pilih divisi terlebih dahulu untuk memunculkan peserta.';
    container.className = 'p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-400 text-center';
    return;
  }
  container.className = 'grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-y-auto pr-1';
  let html = '';
  Array.from(state.addScheduleDivisi)
  .sort((a, b) => DIVISI_ORDER.indexOf(a) - DIVISI_ORDER.indexOf(b))
  .forEach(div => {
    const divUsers = USERS.filter(u => u.divisi === div);
    if(divUsers.length > 0) {
      html += `<div class="col-span-full mt-2 first:mt-0"><span class="text-[10px] font-bold text-evergreen-dark uppercase tracking-wider bg-evergreen-light/40 px-2 py-1 rounded-md">${div}</span></div>`;
      divUsers.forEach(u => {
        const isChecked = state.addScheduleUsers.has(u.id);
        html += `
          <label class="flex items-start gap-2 p-2 border ${isChecked ? 'border-evergreen bg-evergreen-light/20' : 'border-gray-200 bg-white'} rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
            <input type="checkbox" value="${u.id}" data-div="${div}" onchange="handleUserCheck(this)" ${isChecked ? 'checked' : ''} class="mt-0.5 w-4 h-4 text-evergreen-dark rounded border-gray-300" />
            <div class="flex-1 min-w-0"><p class="text-xs font-bold text-gray-800 truncate">${u.name}</p><p class="text-[10px] text-gray-500 truncate">${u.jabatan}</p></div>
          </label>
        `;
      });
    }
  });
  container.innerHTML = html;
};
window.handleUserCheck = function(cb) {
  const userId = cb.value;
  const div = cb.getAttribute('data-div');
  if (cb.checked) {
    state.addScheduleUsers.add(userId);
  } else {
    const divUsers = USERS.filter(u => u.divisi === div);
    const checkedUsersInDiv = divUsers.filter(u => state.addScheduleUsers.has(u.id));
    if (checkedUsersInDiv.length <= 1) {
      alert(`Gagal! Minimal satu peserta (perwakilan) dari divisi ${div} wajib hadir.`);
      cb.checked = true;
      return;
    }
    state.addScheduleUsers.delete(userId);
  }
  renderPesertaCheckboxes(); 
};

/* ===== LABEL PENULIS PER PARAGRAF ===== */
window._newBid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

window.prepareNotulensiEditor = function(editor, stamp) {
  try { document.execCommand('defaultParagraphSeparator', false, 'div'); } catch (e) {}
  const cu = state.currentUser;
  // stamp=true: blok baru diberi nama penulis. stamp=false: konten lama (penulis tidak diketahui)
  const mark = d => {
    if (stamp && cu) { d.dataset.bid = _newBid(); d.dataset.by = cu.name; }
    else d.dataset.bid = 'legacy-' + Math.random().toString(36).slice(2, 8);
  };
  let cur = null;
  Array.from(editor.childNodes).forEach(n => {
    if (n.nodeType === 1 && n.tagName === 'DIV') {
      cur = null;
      if (!n.dataset.bid) mark(n);
      return;
    }
    if (n.nodeType === 3 && !n.textContent.trim() && !cur) { editor.removeChild(n); return; }
    if (!cur) { cur = document.createElement('div'); mark(cur); editor.insertBefore(cur, n); }
    cur.appendChild(n);
  });
  if (!editor.firstChild) editor.innerHTML = '<div><br></div>';
};

window.stampNotulensiAuthor = function() {
  const editor = document.getElementById('notulensi-editor');
  const cu = state.currentUser;
  if (!editor || !cu) return;
  const sel = window.getSelection();

  const loose = Array.from(editor.childNodes).some(n =>
    (n.nodeType === 3 && n.textContent.trim()) || (n.nodeType === 1 && n.tagName !== 'DIV'));
  if (loose) {
    const aN = sel.anchorNode, aO = sel.anchorOffset;
    prepareNotulensiEditor(editor, true);
    if (aN && editor.contains(aN)) {
      const r = document.createRange(); r.setStart(aN, aO); r.collapse(true);
      sel.removeAllRanges(); sel.addRange(r);
    }
  }

  let node = sel.anchorNode;
  if (node && editor.contains(node)) {
    while (node && node.parentNode !== editor) node = node.parentNode;
    if (node && node.nodeType === 1) {
      const bid = node.dataset.bid;
      const duplicated = bid && Array.from(editor.children).some(b => b !== node && b.dataset.bid === bid);
      if (!bid || duplicated) { node.dataset.bid = _newBid(); node.dataset.by = cu.name; }
    }
  }
  Array.from(editor.children).forEach(b => {
    if (!b.dataset.bid) { b.dataset.bid = _newBid(); b.dataset.by = cu.name; }
  });
};

// Jika mengetik di blok milik orang lain, pindahkan kursor ke blok baru atas nama sendiri
window.guardForeignBlock = function(e) {
  if (!e.inputType || !e.inputType.startsWith('insert')) return;
  const editor = document.getElementById('notulensi-editor');
  const cu = state.currentUser;
  if (!editor || !cu) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  let node = sel.anchorNode;
  if (!node || node === editor || !editor.contains(node)) return;
  const elx = node.nodeType === 3 ? node.parentElement : node;
if (elx && elx.closest && elx.closest('td,th,li')) return;   // di dalam sel tabel: jangan pindahkan kursor
  while (node.parentNode !== editor) node = node.parentNode;
  if (node.nodeType !== 1) return;
  const by = node.dataset.by;
  if (!by || by === cu.name) return;          // blok sendiri atau blok lama tanpa label: biarkan
  const nb = document.createElement('div');
  nb.dataset.bid = _newBid();
  nb.dataset.by = cu.name;
  nb.innerHTML = '<br>';
  node.insertAdjacentElement('afterend', nb);
  const r = document.createRange();
  r.setStart(nb, 0); r.collapse(true);
  sel.removeAllRanges(); sel.addRange(r);
};

window.handleEditorBlankClick = function(e) {
  const ed = e.currentTarget;
  if (e.target !== ed) return;                        // hanya klik di area kosong editor
  let target = ed.lastElementChild;
  const empty = target && target.textContent.replace(/\u200b/g, '').trim() === '' && !target.querySelector('table');
  if (!empty) {
    target = document.createElement('div');
    target.dataset.bid = _newBid(); target.dataset.by = state.currentUser.name;
    target.innerHTML = '<br>';
    ed.appendChild(target);
  }
  const r = document.createRange(); r.setStart(target, 0); r.collapse(true);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  ed.focus();
};

// Enter = baris baru dalam blok yang sama; Shift+Enter = blok baru (label penulis baru)
window.handleNotulensiKey = function(e) {
  if (e.key !== 'Enter' || e.isComposing) return;
  const sel = window.getSelection();
  let n = sel.anchorNode; if (n && n.nodeType === 3) n = n.parentElement;
  if (n && n.closest && n.closest('li')) return;   // di dalam daftar: pakai perilaku bawaan (item baru)
  e.preventDefault();
  const inCell = !!(n && n.closest && n.closest('td,th'));
  if (e.shiftKey && !inCell) document.execCommand('insertParagraph');
  else document.execCommand('insertLineBreak');
};

window.notulensiFormat = function(cmd) {
  const ed = document.getElementById('notulensi-editor'); if (!ed) return;
  const sel = window.getSelection();
  if (!sel.rangeCount || !ed.contains(sel.anchorNode)) ed.focus();
  document.execCommand(cmd, false, null);
  ed.dispatchEvent(new Event('input', { bubbles: true }));   // simpan draft + sinkron live
};

// Backspace di awal item daftar: keluarkan item dari daftar (hilangkan bullet/nomor)
window.handleNotulensiBackspace = function(e) {
  if (e.key !== 'Backspace') return;
  const sel = window.getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  let n = sel.anchorNode; if (n && n.nodeType === 3) n = n.parentElement;
  const li = n && n.closest ? n.closest('li') : null;
  if (!li) return;
  // Cek apakah kursor tepat di awal item
  const r = document.createRange();
  r.selectNodeContents(li);
  r.setEnd(sel.anchorNode, sel.anchorOffset);
  if (r.toString().replace(/\u200b/g, '') !== '') return;   // masih ada teks di kiri kursor
  e.preventDefault();
  const list = li.parentElement;
  const type = list.tagName === 'OL' ? 'insertOrderedList' : 'insertUnorderedList';
  document.execCommand(type, false, null);                   // toggle: item keluar dari daftar
  const ed = document.getElementById('notulensi-editor');
  if (ed) ed.dispatchEvent(new Event('input', { bubbles: true }));
};

window.insertNotulensiTable = function() {
  const ed = document.getElementById('notulensi-editor'); if (!ed) return;
  const rows = Math.min(30, Math.max(1, parseInt(document.getElementById('nt-rows').value) || 3));

// Tempel tabel dari Excel/Word/Docs: dibersihkan lalu dimasukkan sebagai tabel
window.handleNotulensiPaste = function(e) {
  const html = e.clipboardData && e.clipboardData.getData('text/html');
  if (!html || !/<table/i.test(html)) return;      // selain tabel: perilaku normal
  e.preventDefault();
  const clean = DOMPurify.sanitize(html, {
    ALLOWED_TAGS: ['table','thead','tbody','tfoot','tr','td','th','br','b','strong','i','em','u','p','div','span'],
    ALLOWED_ATTR: ['colspan','rowspan','style','bgcolor','align']
  });
  const tmp = document.createElement('div'); tmp.innerHTML = clean;
  tmp.querySelectorAll('table').forEach(t => t.classList.add('notulensi-table'));
  document.execCommand('insertHTML', false, tmp.innerHTML);
};

window._tblCell = function() {
  const ed = document.getElementById('notulensi-editor'), sel = window.getSelection();
  if (!ed || !sel.rangeCount) return null;
  let n = sel.anchorNode; if (n && n.nodeType === 3) n = n.parentElement;
  const cell = n && n.closest ? n.closest('td,th') : null;
  return cell && ed.contains(cell) ? cell : null;
};

window.tableOp = function(op) {
  const ed = document.getElementById('notulensi-editor');
  const cell = window._tblCell();
  if (!ed || !cell) return alert('Klik di dalam sel tabel terlebih dahulu.');
  const table = cell.closest('table'), tr = cell.parentElement;
  const rows = Array.from(table.rows), ci = cell.cellIndex;
  const mk = () => { const td = document.createElement('td'); td.innerHTML = '<br>'; return td; };
  const removeTable = () => {
    const p = table.parentElement;
    table.remove();
    if (p && p !== ed && !p.textContent.trim() && !p.querySelector('br,table')) p.innerHTML = '<br>';
  };

  if (op === 'rowAbove' || op === 'rowBelow') {
    const nr = document.createElement('tr');
    const n = Array.from(tr.cells).reduce((a, c) => a + (c.colSpan || 1), 0);
    for (let i = 0; i < n; i++) nr.appendChild(mk());
    tr.parentNode.insertBefore(nr, op === 'rowAbove' ? tr : tr.nextSibling);
  } else if (op === 'colLeft' || op === 'colRight') {
    rows.forEach(r => {
      const c = r.cells[ci], nc = mk();
      if (!c) r.appendChild(nc);
      else r.insertBefore(nc, op === 'colLeft' ? c : c.nextSibling);
    });
  } else if (op === 'delRow') {
    if (rows.length <= 1) removeTable(); else tr.remove();
  } else if (op === 'delCol') {
    if (tr.cells.length <= 1) removeTable(); else rows.forEach(r => r.cells[ci] && r.cells[ci].remove());
  } else if (op === 'delTable') {
    if (!confirm('Hapus seluruh tabel ini?')) return;
    removeTable();
  }
  ed.dispatchEvent(new Event('input', { bubbles: true }));   // simpan draft + sinkron live
  const bar = document.getElementById('nt-table-tools');
  if (bar) bar.style.display = window._tblCell() ? 'flex' : 'none';
};

  const bar = document.getElementById('nt-table-tools');
  if (bar) bar.style.display = window._tblCell() ? 'flex' : 'none';
});

window.initLiveNotulensi = function(scheduleId) {
  window.stopLiveNotulensi();
  const editor = document.getElementById('notulensi-editor');
  if (!editor) return;
  prepareNotulensiEditor(editor);

  const typingInd = document.getElementById('live-typing-indicator');
  const cu = state.currentUser;
  const base = 'gaspol_live/' + scheduleId;
  const htmlRef = window.ref(window.rtdb, base + '/html');
  const typingRef = window.ref(window.rtdb, base + '/typing');

  let isEditing = false, hideTimer = null, pushTimer = null, lastTyping = 0;
  editor.addEventListener('focus', () => isEditing = true);
  editor.addEventListener('blur', () => isEditing = false);

  const unsubHtml = window.onValue(htmlRef, snap => {
    const serverHTML = snap.val();
    if (serverHTML === null) return;
    if (serverHTML !== editor.innerHTML && !isEditing) {
      editor.innerHTML = serverHTML;
      prepareNotulensiEditor(editor);
    }
  });
  const unsubTyping = window.onValue(typingRef, snap => {
    const d = snap.val();
    if (!typingInd) return;
    clearTimeout(hideTimer);
    if (d && d.uid !== cu.id && Date.now() - d.time < 3000) {
      typingInd.innerHTML = `${icon('edit-3', 'w-3 h-3 inline-block mr-1')} ${esc(d.name)} sedang mengetik...`;
      refreshIcons();
      hideTimer = setTimeout(() => { typingInd.innerHTML = ''; }, 3000);
    } else { typingInd.innerHTML = ''; }
  });

  window.triggerTyping = function() {
    const now = Date.now();
    if (now - lastTyping > 1500) { lastTyping = now; window.set(typingRef, { uid: cu.id, name: cu.name, time: now }); }
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => window.set(htmlRef, editor.innerHTML), 1000);
  };

  window._liveUnsubs.push(unsubHtml, unsubTyping, () => { clearTimeout(pushTimer); clearTimeout(hideTimer); });
};

// Pecah nama lengkap menjadi gelar depan, nama, dan gelar belakang
// Daftar gelar depan yang dikenali (dengan/tanpa titik, huruf besar/kecil)
const FRONT_TITLES = /^(dr|drg|dra|drs|ns|ners|prof|ir|h|hj|apt|kh)\.?$/i;
const titleKey = t => t.toLowerCase().replace(/\./g, '');

// Pecah nama lengkap menjadi gelar depan, nama, dan gelar belakang
window.parseName = function(full) {
  const parts = (full || '').split(',').map(x => x.trim()).filter(Boolean);
  const main = parts.shift() || '';
  const toks = main.split(/\s+/).filter(Boolean);
  const front = [], seen = new Set();
  while (toks.length > 1 && (FRONT_TITLES.test(toks[0]) || /^[A-Za-z]{1,5}\.$/.test(toks[0]))) {
    const t = toks.shift();
    if (!seen.has(titleKey(t))) { seen.add(titleKey(t)); front.push(t); }   // buang gelar ganda
  }
  return { front: front.join(' '), name: toks.join(' '), back: parts.join(', ') };
};

// Gabungkan kembali dengan rapi: gelar yang diisi menggantikan gelar lama
window.buildName = function(front, name, back) {
  const p = window.parseName(name);
  const f = (front || '').trim() || p.front;
  const seen = new Set(), backs = [];
  (String(back || '') + ',' + p.back).split(',').forEach(x => {
    const t = x.trim();
    const k = t.toLowerCase().replace(/[\s.]/g, '');
    if (t && !seen.has(k)) { seen.add(k); backs.push(t); }
  });
  let out = p.name;
  if (f) out = f + ' ' + out;
  if (backs.length) out += ', ' + backs.join(', ');
  return out.replace(/\s+/g, ' ').trim();
};

window.submitEditProfile = async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-submit-ep');
  const originalText = btn.innerHTML;
  btn.innerHTML = 'Menyimpan...';
  btn.disabled = true;

  const gelarDepan = document.getElementById('ep-gelar-depan').value.trim();
  const namaTengah = document.getElementById('ep-nama').value.trim();
  const gelarBelakang = document.getElementById('ep-gelar-belakang').value.trim();

  const combinedName = buildName(gelarDepan, namaTengah, gelarBelakang);

  const oldPass = document.getElementById('ep-old-password').value;
  const newEmail = document.getElementById('ep-email').value.trim();
  const newPass = document.getElementById('ep-new-password').value;
  const codename = (document.getElementById('ep-codename') || {}).value ? document.getElementById('ep-codename').value.trim() : '';

  try {
    const user = window.auth.currentUser;
    if (!user) throw new Error("Tidak ada sesi user aktif.");

    const emailChanged = newEmail !== user.email;
    const passChanged = !!newPass;

    // Autentikasi ulang hanya bila dibutuhkan
    const reauth = async () => {
      if (!oldPass) { const err = new Error('need-old-password'); err.code = 'app/need-old-password'; throw err; }
      const credential = window.EmailAuthProvider.credential(user.email, oldPass);
      await window.reauthenticateWithCredential(user, credential);
    };

    if (passChanged) await reauth();

    if (emailChanged) {
      try {
        await window.updateEmail(user, newEmail);
      } catch (err) {
        if (err.code === 'auth/requires-recent-login') {
          await reauth();
          await window.updateEmail(user, newEmail);
        } else throw err;
      }
    }
    if (passChanged) await window.updatePassword(user, newPass);

    if (emailChanged) {
      state.currentUser.email = newEmail;
      await window.set(window.ref(window.rtdb, "gaspol_users/" + state.currentUser.id + "/email"), newEmail);
    }
    if (combinedName !== state.currentUser.name) {
      state.currentUser.name = combinedName;
      await window.set(window.ref(window.rtdb, "gaspol_users/" + state.currentUser.id + "/name"), combinedName);
    }
    if (codename !== (state.currentUser.codename || '')) {
      state.currentUser.codename = codename;
      await window.set(window.ref(window.rtdb, "gaspol_users/" + state.currentUser.id + "/codename"), codename);
    }
    alert("Profil akun & gelar berhasil diperbarui!");
    closeModal();
    document.getElementById('topbar').innerHTML = renderTopBar();
  } catch (error) {
    console.error(error);
    if (error.code === 'app/need-old-password') alert("Demi keamanan, isi kolom Password Lama dengan password Anda saat ini untuk mengganti email atau password.");
    else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') alert("Gagal: Password Lama yang Anda masukkan salah!");
    else if (error.code === 'auth/email-already-in-use') alert("Gagal: Email baru tersebut sudah digunakan.");
    else if (error.code === 'auth/operation-not-allowed') alert("Firebase menolak ganti email langsung (fitur Email Enumeration Protection aktif di proyek Firebase Anda). Nama dan gelar tetap bisa diganti tanpa mengubah email.");
    else alert("Gagal memperbarui profil: " + error.message);
  } finally {
    btn.innerHTML = originalText;
    btn.disabled = false;
  }
  return false;
};

/* ===== TANDA TANGAN (TTD) ===== */
// Perkecil + hapus latar putih, hasil tetap PNG transparan
window.compressSignature = function(file, maxSize = 2400) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * k), h = Math.round(img.height * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const id = ctx.getImageData(0, 0, w, h), d = id.data;
          const hist = new Uint32Array(256); let total = 0;
          for (let i = 0; i < d.length; i += 4) {
            if (d[i + 3] < 40) continue;
            hist[Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2])]++; total++;
          }
          const pct = p => { let acc = 0; for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= total * p) return v; } return 255; };
          const hi = pct(0.6);
          let lo = pct(0.005);
          if (hi - lo < 30) lo = Math.max(0, hi - 30);

          let minX = w, minY = h, maxX = 0, maxY = 0;
          for (let i = 0; i < d.length; i += 4) {
            const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            let t = (hi - lum) / (hi - lo);
            t = Math.max(0, Math.min(1, (t - 0.12) / 0.5));
            t = t * t * (3 - 2 * t);
            const a = Math.round(Math.min(d[i + 3], t * 255));
            d[i] = 15; d[i + 1] = 20; d[i + 2] = 60; d[i + 3] = a;
            if (a > 120) {
              const idx = i / 4, x = idx % w, y = (idx / w) | 0;
              if (x < minX) minX = x; if (x > maxX) maxX = x;
              if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
          }
          ctx.putImageData(id, 0, 0);

          // Pangkas ke area tanda tangan
          let cut = c;
          if (maxX > minX && maxY > minY) {
            const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.03);
            const sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
            const sw = Math.min(w, maxX + pad) - sx, sh = Math.min(h, maxY + pad) - sy;
            cut = document.createElement('canvas'); cut.width = sw; cut.height = sh;
            cut.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh);
          }

          // Perbesar halus (minimal lebar 1800 px) agar tidak pecah saat dicetak
          const up = Math.min(6, Math.max(1, 1800 / cut.width));
          const big = document.createElement('canvas');
          big.width = Math.round(cut.width * up); big.height = Math.round(cut.height * up);
          const bctx = big.getContext('2d', { willReadFrequently: true });
          bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
          bctx.drawImage(cut, 0, 0, big.width, big.height);

          // Pertajam tepi setelah diperbesar
          const bd = bctx.getImageData(0, 0, big.width, big.height), p = bd.data;
          for (let i = 3; i < p.length; i += 4) {
            let t = (p[i] / 255 - 0.25) / 0.5;
            t = Math.max(0, Math.min(1, t));
            p[i] = Math.round(t * t * (3 - 2 * t) * 255);
          }
          bctx.putImageData(bd, 0, 0);

          big.toBlob(b => b ? resolve(new File([b], 'ttd.png', { type: 'image/png' })) : reject(new Error('Gagal memproses gambar')), 'image/png');
        } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
};

window.refreshTtdPreview = function() {
  const img = document.getElementById('ep-ttd-preview'), empty = document.getElementById('ep-ttd-empty');
  if (!img || !empty) return;
  const u = state.currentUser.ttd;
  if (u) { img.src = u; img.classList.remove('hidden'); empty.classList.add('hidden'); }
  else { img.removeAttribute('src'); img.classList.add('hidden'); empty.classList.remove('hidden'); }
};

window.uploadMySignature = async function(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { input.value = ''; return alert('File harus berupa gambar.'); }
  alert('Memproses dan mengunggah tanda tangan...');
  try {
    const f = await window.compressSignature(file);
    const fd = new FormData();
    fd.append('file', f);
    fd.append('upload_preset', window.CLOUDINARY_PRESET);
    const res = await fetch(window.CLOUDINARY_URL, { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.secure_url) throw new Error((data.error && data.error.message) || 'Upload gagal');
    await window.set(window.ref(window.rtdb, 'gaspol_users/' + state.currentUser.id + '/ttd'), data.secure_url);
    state.currentUser.ttd = data.secure_url;
    refreshTtdPreview();
    alert('Tanda tangan berhasil disimpan!');
  } catch (err) {
    console.error(err);
    alert('Gagal mengunggah tanda tangan: ' + err.message);
  }
  input.value = '';
};

window.removeMySignature = async function() {
  if (!state.currentUser.ttd) return;
  if (!confirm('Hapus tanda tangan Anda?')) return;
  try {
    await window.remove(window.ref(window.rtdb, 'gaspol_users/' + state.currentUser.id + '/ttd'));
    delete state.currentUser.ttd;
    refreshTtdPreview();
    alert('Tanda tangan dihapus.');
  } catch (err) { console.error(err); alert('Gagal menghapus tanda tangan.'); }
};

window.submitAddSchedule = async function(e) {
  e.preventDefault(); // Mencegah browser melakukan refresh halaman
  const nama = document.getElementById('as-nama').value.trim();
  const tanggal = document.getElementById('as-tanggal').value;
  const waktuMulai = document.getElementById('as-waktu-mulai').value;
  const waktuSelesai = document.getElementById('as-waktu-selesai').value;
  const link = document.getElementById('as-link') ? document.getElementById('as-link').value.trim() : '';
  const lokasi = document.getElementById('as-lokasi').value.trim();
  const zoomEl = document.getElementById('as-zoom');
  const zoomLink = zoomEl ? zoomEl.value.trim() : '';
  if (zoomLink && !/^https?:\/\//i.test(zoomLink)) {
    alert('Link Zoom harus diawali http:// atau https://');
    return false;
  }
  // Perbaikan: Pastikan elemen input ada sebelum mengambil nilainya
  const usersEl = document.getElementById('as-users-additional');
  const additionalUsers = usersEl ? usersEl.value.trim() : '';

  if(!nama || !tanggal || !waktuMulai) return false;

const selectedDate = new Date(tanggal + 'T00:00:00');
  const todayDate = new Date();
  todayDate.setHours(0,0,0,0); // Reset jam agar perbandingan adil
  
  if (selectedDate < todayDate) {
    alert('Pemberitahuan: Tanggal sudah berlalu. Anda tidak bisa membuat agenda di masa lalu.');
    return false;
  }

  // Sekretaris direktorat: wajib melibatkan minimal 1 divisi di bawah direktoratnya
  if (isLiteAdmin()) {
    const scope = getScopeDivisi(); // [nama direktorat, ...divisi bawahannya]
    const terlibat = Array.from(state.addScheduleDivisi).some(d => scope.includes(d));
    if (!terlibat) {
      alert(`Agenda harus melibatkan minimal satu divisi di bawah ${state.currentUser.scopeDirektorat}.`);
      return false;
    }
  }

  let waktu = waktuMulai;
  if (waktuSelesai) waktu += ' - ' + waktuSelesai;
  else waktu += ' - Selesai';

  // Mapping ID user ke Nama User
  let picNames = Array.from(state.addScheduleUsers).map(id => {
    const u = window.USERS.find(x => x.id === id); 
    return u ? u.name : '';
  }).filter(Boolean);

  if (additionalUsers) {
    const arrAdd = additionalUsers.split(',').map(x => x.trim()).filter(Boolean);
    picNames = [...picNames, ...arrAdd];
  }

  const newSchedule = {
    id: 's' + Date.now(),
    inputDate: toISO(today),
    nama: nama,
    tanggal: tanggal,
    waktu: waktu,
    lokasi: lokasi,
    refLink: link,
    zoomLink: zoomLink,
    divisi: Array.from(state.addScheduleDivisi),
    users: picNames,
    level: 'Operasional', // Default level untuk agenda
    status: 'Scheduled',
    notulensi: '',
    dokumentasi: [],
    isArchived: false,
    createdBy: state.currentUser.id,
    createdByName: state.currentUser.name
  };

  await window.set(window.ref(window.rtdb, "gaspol_schedules/" + newSchedule.id), newSchedule);
  closeModal(); 
  return false;
};

window.toggleAllTaskDivisi = function(cb) {

  const checkboxes = document.querySelectorAll(
    '#cb-task-select-all ~ * .task-divisi-cb, .task-divisi-cb'
  );

  if (cb.checked) {

    // Pilih semua divisi
    state.addTaskDivisi = new Set(allDivOptions());

    // Pilih semua user dari seluruh divisi
    state.addTaskUsers = new Set(
      USERS.map(u => u.id)
    );

    // Centang semua checkbox divisi
    document
      .querySelectorAll('.task-divisi-cb')
      .forEach(c => {
        c.checked = true;
      });

  } else {

    // Bersihkan semua pilihan
    state.addTaskDivisi.clear();
    state.addTaskUsers.clear();

    document
      .querySelectorAll('.task-divisi-cb')
      .forEach(c => {
        c.checked = false;
      });
  }

  // Tampilkan seluruh PIC yang sesuai
  renderTaskPesertaCheckboxes();
};

window.handleTaskDivisiCheck = function(cb) {

  const div = cb.value;
  const selectAllCb =
    document.getElementById('cb-task-select-all');

  if (cb.checked) {

    state.addTaskDivisi.add(div);

    USERS
      .filter(u => u.divisi === div)
      .forEach(u => {
        state.addTaskUsers.add(u.id);
      });

  } else {

    state.addTaskDivisi.delete(div);

    USERS
      .filter(u => u.divisi === div)
      .forEach(u => {
        state.addTaskUsers.delete(u.id);
      });
  }

  // Update status checkbox "Pilih Semua"
  if (selectAllCb) {

    selectAllCb.checked =
      state.addTaskDivisi.size === allDivOptions().length;

    selectAllCb.indeterminate =
      state.addTaskDivisi.size > 0 &&
      state.addTaskDivisi.size < allDivOptions().length;
  }

  renderTaskPesertaCheckboxes();
};

window.renderTaskPesertaCheckboxes = function() {
  const container = document.getElementById('task-peserta-container');
  if (state.addTaskDivisi.size === 0) {
    container.innerHTML = 'Pilih divisi terlebih dahulu untuk memunculkan PIC.';
    container.className = 'p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-400 text-center';
    return;
  }
  container.className = 'grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-52 overflow-y-auto pr-1';
  let html = '';
    Array.from(state.addTaskDivisi)
  .sort((a, b) => DIVISI_ORDER.indexOf(a) - DIVISI_ORDER.indexOf(b))
  .forEach(div => {
    const divUsers = USERS.filter(u => u.divisi === div);
    if(divUsers.length > 0) {
      html += `<div class="col-span-full mt-2 first:mt-0"><span class="text-[10px] font-bold text-evergreen-dark uppercase tracking-wider bg-evergreen-light/40 px-2 py-1 rounded-md">${div}</span></div>`;
      divUsers.forEach(u => {
        const isChecked = state.addTaskUsers.has(u.id);
        html += `
          <label class="flex items-start gap-2 p-2 border ${isChecked ? 'border-evergreen bg-evergreen-light/20' : 'border-gray-200 bg-white'} rounded-lg cursor-pointer hover:bg-slate-50 transition-all">
            <input type="checkbox" value="${u.id}" onchange="handleTaskUserCheck(this)" ${isChecked ? 'checked' : ''} class="mt-0.5 w-4 h-4 text-evergreen-dark rounded border-gray-300" />
            <div class="flex-1 min-w-0"><p class="text-xs font-bold text-gray-800 truncate">${u.name}</p><p class="text-[10px] text-gray-500 truncate">${u.jabatan}</p></div>
          </label>
        `;
      });
    }
  });
  container.innerHTML = html;
};

window.handleTaskUserCheck = function(cb) {
  const userId = cb.value;
  if (cb.checked) { state.addTaskUsers.add(userId); } else { state.addTaskUsers.delete(userId); }
  renderTaskPesertaCheckboxes(); 
};

window.requestExtension = async function(id) {

window.handleUmanLink = async function() {
  const id = new URLSearchParams(location.search).get('uman');
  if (!id || window._umanHandled || !window.state.currentUser) return;
  window._umanHandled = true;
  for (let i = 0; i < 40 && !(window.USERS || []).length; i++) await new Promise(r => setTimeout(r, 250)); // tunggu data user
  try {
    const snap = await window.get(window.child(window.ref(window.rtdb), 'gaspol_schedules/' + id));
    if (!snap.exists()) return alert('Dokumen Uman tidak ditemukan.');
    const s = snap.val();
    s.divisi = s.divisi || []; s.users = s.users || []; s.dokumentasi = s.dokumentasi || []; s.hadir = s.hadir || [];
    window._archivedSchedCache = window._archivedSchedCache || {};
    window._archivedSchedCache[id] = s;
    await window.printUman(id, { sameTab: true });
  } catch (e) { console.error(e); alert('Gagal membuka Uman.'); }
};

window.submitRegister = async function(e) {

  e.preventDefault();

  const rawGelarDepan = document.getElementById('register-gelar-depan').value.trim();
  const rawName = document.getElementById('register-name').value.trim();
  const rawGelarBelakang = document.getElementById('register-gelar-belakang').value.trim();

  // Logika Penggabungan: [Gelar Depan] [Nama], [Gelar Belakang]
  let name = rawName;
  
  if (rawGelarDepan) {
      name = `${rawGelarDepan} ${name}`;
  }
  
  if (rawGelarBelakang) {
      // Hilangkan koma jika user tidak sengaja mengetiknya di awal input
      const cleanGelarBelakang = rawGelarBelakang.startsWith(',') 
          ? rawGelarBelakang.substring(1).trim() 
          : rawGelarBelakang;
      name = `${name}, ${cleanGelarBelakang}`;
  }
  
  // Bersihkan spasi ganda jika ada
  name = name.replace(/\s+/g, ' ').trim();

  
  const email =
    document.getElementById('register-email').value.trim();

  const jabatan =
    document.getElementById('register-jabatan').value;

  const password =
    document.getElementById('register-password').value;

  const confirmPassword =
    document.getElementById('register-password-confirm').value;

  const job =
    REGISTER_JOBS.find(
      j => j.jabatan === jabatan
    );

  const btnSubmit =
    e.target.querySelector('button[type="submit"]');

  const originalText =
    btnSubmit.innerHTML;

  if (!job) {
    alert("Silakan pilih jabatan.");
    return false;
  }

  if (password !== confirmPassword) {
    alert("Konfirmasi password tidak sama.");
    return false;
  }

  btnSubmit.innerHTML = "Mendaftarkan...";
  btnSubmit.disabled = true;

  try {

    /*
     * =====================================================
     * 1. CEK APAKAH SLOT JABATAN SUDAH TERISI
     * =====================================================
     */

    const usersSnapshot =
      await window.get(
        window.ref(window.rtdb, "gaspol_users")
      );

    if (usersSnapshot.exists()) {

      const usersData =
        usersSnapshot.val();

      const jabatanSudahTerisi =
        Object.values(usersData).some(
          user => user.jabatan === jabatan
        );

      if (jabatanSudahTerisi) {

        alert(
          `Jabatan "${jabatan}" sudah terdaftar. `
          + `Setiap jabatan hanya dapat memiliki 1 akun.`
        );

        btnSubmit.innerHTML = originalText;
        btnSubmit.disabled = false;

        return false;
      }
    }


    /*
     * =====================================================
     * 2. BUAT AKUN DI FIREBASE AUTHENTICATION
     * =====================================================
     */

    const credential =
      await window.createUserWithEmailAndPassword(
        window.auth,
        email,
        password
      );

    const firebaseUser =
      credential.user;


    /*
     * =====================================================
     * 3. TENTUKAN ROLE
     * =====================================================
     */

    const role = job.role;

    /*
     * =====================================================
     * 4. SIMPAN PROFIL USER KE RTDB
     * =====================================================
     */

    const userData = {

      id: firebaseUser.uid,

      uid: firebaseUser.uid,

      name: name,

      email: email,

      divisi: job.divisi,

      jabatan: jabatan,

      role: role,

      title: jabatan,

            createdAt: new Date().toISOString(),
      ...(job.scopeDirektorat ? { scopeDirektorat: job.scopeDirektorat } : {})

    };


    await window.set(
      window.ref(
        window.rtdb,
        "gaspol_users/" + firebaseUser.uid
      ),
      userData
    );


    /*
     * =====================================================
     * 5. LOGOUT DARI FIREBASE AUTH
     * =====================================================
     *
     * User TIDAK langsung masuk ke dashboard.
     * Setelah daftar selesai, kita kembalikan ke
     * halaman "Pilih Akses".
     */

    await window.signOut(window.auth);


    /*
     * =====================================================
     * 6. RESET STATE LOGIN
     * =====================================================
     */

    state.currentUser = null;

    state.isRegistering = false;

    state.loginType = null;


    /*
     * =====================================================
     * 7. KEMBALI KE HALAMAN "PILIH AKSES"
     * =====================================================
     */

    renderLoginCardContent();


    /*
     * =====================================================
     * 8. BERIKAN NOTIFIKASI
     * =====================================================
     */

    setTimeout(() => {

      alert(
        "Pendaftaran berhasil!\n\n"
        + "Akun Anda sudah dibuat. "
        + "Silakan pilih akses dan login menggunakan email "
        + "serta password yang telah didaftarkan."
      );

    }, 100);


  } catch (error) {

    console.error(
      "Error registration:",
      error
    );


    /*
     * ERROR FIREBASE AUTH
     */

    if (
      error.code ===
      'auth/email-already-in-use'
    ) {

      alert(
        "Email tersebut sudah terdaftar."
      );

    }

    else if (
      error.code ===
      'auth/invalid-email'
    ) {

      alert(
        "Format email tidak valid."
      );

    }

    else if (
      error.code ===
      'auth/weak-password'
    ) {

      alert(
        "Password terlalu lemah. "
        + "Gunakan minimal 6 karakter."
      );

    }

    else {

      alert(
        "Pendaftaran gagal:\n"
        + error.message
      );

    }


    btnSubmit.innerHTML = originalText;
    btnSubmit.disabled = false;

  }

  return false;
};

window.submitLogin = async function(e) {
  e.preventDefault();

  const emailInput =
    document.getElementById('login-name').value.trim();

  const passInput =
    document.getElementById('login-password').value;

  const btnSubmit =
    e.target.querySelector('button[type="submit"]');

  const originalText =
    btnSubmit.innerHTML;

  btnSubmit.innerHTML = "Memeriksa...";
  btnSubmit.disabled = true;

  try {

    // LOGIN FIREBASE AUTH
    const credential =
      await window.signInWithEmailAndPassword(
        window.auth,
        emailInput,
        passInput
      );

    const firebaseUser =
      credential.user;

    // AMBIL DATA PROFIL USER DARI RTDB
    const dbRef =
      window.ref(window.rtdb);

    const snapshot =
      await window.get(
        window.child(
          dbRef,
          "gaspol_users/" + firebaseUser.uid
        )
      );

    if (!snapshot.exists()) {

      await window.signOut(window.auth);

      alert(
        "Akun berhasil login, tetapi profil user belum ditemukan."
      );

      btnSubmit.innerHTML = originalText;
      btnSubmit.disabled = false;

      return false;
    }

        const successUser = normalizeUser(snapshot.val());

    // CEK ROLE (Direktur Utama boleh masuk lewat menu mana pun)
    if (successUser.jabatan !== 'Plh.Direktur Utama' && successUser.role !== state.loginType) {

      await window.signOut(window.auth);

      alert(
        "Akun tidak memiliki akses pada menu ini."
      );

      btnSubmit.innerHTML = originalText;
      btnSubmit.disabled = false;

      return false;
    }

    // LOGIN BERHASIL
    state.currentUser = successUser;
    window.applyScopeFilter();
    const root =
      document.getElementById('root');

    root.style.opacity = '0';
    root.style.transform = 'scale(0.95)';

    setTimeout(() => {

      mountApp();

      root.style.opacity = '1';
      root.style.transform = 'scale(1)';

    }, 500);

  } catch (error) {

    console.error("Error login:", error);

    if (
      error.code === 'auth/invalid-credential'
    ) {

      alert("Email atau password salah.");

    } else if (
      error.code === 'auth/invalid-email'
    ) {

      alert("Format email tidak valid.");

    } else {

      alert(
        "Login gagal: " +
        error.message
      );
    }

    btnSubmit.innerHTML = originalText;
    btnSubmit.disabled = false;
  }

  return false;
};

window.forgotPassword = async function() {
  const emailEl = document.getElementById('login-name');
  const email = emailEl ? emailEl.value.trim() : '';
  if (!email) return alert('Isi kolom Email terlebih dahulu, lalu klik "Lupa password?".');
  try {
    await window.sendPasswordResetEmail(window.auth, email);
  } catch (err) {
    console.error(err);
    if (err.code === 'auth/invalid-email') return alert('Format email tidak valid.');
    if (err.code === 'auth/too-many-requests') return alert('Terlalu banyak permintaan. Coba lagi beberapa saat.');
  }
  // Pesan sengaja sama untuk email terdaftar maupun tidak, agar email orang lain tidak bisa ditebak
  alert('Jika email terdaftar, tautan reset password telah dikirim. Periksa Inbox dan folder Spam.');
};

};

window.switchTab = function(tab){ 
  if(state.activeTab === tab) return; 
  
  state.activeTab = tab; 
  
  localStorage.setItem('gaspol_activeTab', tab);

  // --- EFEK ANIMASI SLIDER MULUS (Tidak Patah-patah) ---
  // Menggeser slider menggunakan JS secara visual sebelum topbar dirender ulang
  const cu = state.currentUser;
    const newIndex = getTabs().map(t => t[0]).indexOf(tab);
  state.topScrolled = false;
  window.scrollTo(0, 0);

  const slider = document.getElementById('tab-slider');
  if (slider) {
    slider.style.transform = `translateX(${newIndex * 100}%)`;
  }
  // -----------------------------------------------------

  const content = document.getElementById('tab-content');
  content.style.opacity = '0';
  content.style.transform = 'translateY(15px)';
  
  setTimeout(() => {
    // Memindahkan renderTopBar ke dalam timeout 
    // agar tidak memutus animasi pergerakan slider yang sedang meluncur
    document.getElementById('topbar').innerHTML = renderTopBar();
    renderTabContent(); 
    content.style.opacity = '1';
    content.style.transform = 'translateY(0)';
  }, 250); // Waktu jeda dipersingkat agar lebih responsif
};

function donutChartHtml(pieData){
  let acc = 0;
  const segments = pieData.map(d => {
    const total = pieData.reduce((s,x)=>s+x.value,0) || 1;
    const pct = d.value/total*100;
    const seg = `${TASK_STATUS_STYLE[d.name].hex} ${acc}% ${acc+pct}%`;
    acc += pct;
    return seg;
  }).join(', ');
  return `
  <div class="flex items-center justify-center py-1">
  <div class="relative w-40 h-40 rounded-full shadow-inner" style="background: conic-gradient(${segments || '#e5e7eb 0% 100%'});">
    <div class="absolute inset-0 m-auto w-28 h-28 rounded-full bg-white flex items-center justify-center flex-col shadow-sm">
      <span class="text-3xl font-extrabold text-gray-800">${pieData.reduce((s,x)=>s+x.value,0)}</span>
      <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest mt-1">Total</span>
    </div>
  </div>
</div>`;
}

function adminCalendarHtml() {
  const activeDate = state.selectedDate || toISO(today);

  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const eventMap = {};
  tasks.forEach(t => { if (!eventMap[t.deadline]) eventMap[t.deadline] = { task: 0, schedule: 0 }; eventMap[t.deadline].task++; });
  schedules.forEach(s => { if (!eventMap[s.tanggal]) eventMap[s.tanggal] = { task: 0, schedule: 0 }; eventMap[s.tanggal].schedule++; });

  let cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

    return `
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2">${icon('calendar', 'w-4.5 h-4.5 text-evergreen-dark')}<h2 class="font-semibold text-gray-800 capitalize">${monthLabel}</h2></div>

    ${dayNames.map(d => `<div>${d}</div>`).join('')}
  </div>
  <div class="grid grid-cols-7 gap-1 text-sm">
    ${cells.map(d => {
      if (!d) return '<div></div>';
      const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isSelected = iso === activeDate;
      const isToday = iso === toISO(today);
      const events = eventMap[iso] || {};
      let baseClass = "h-10 sm:h-12 flex flex-col items-center justify-center rounded-xl cursor-pointer transition-all duration-200 relative border border-transparent";
      if (isSelected) baseClass += " bg-evergreen text-gray-900 font-bold shadow-md";
      else if (isToday) baseClass += " bg-evergreen-light/40 text-evergreen-dark font-bold border-evergreen-light";

window.updateUserDashboardPartial = function() {
  const tasksContainer = document.getElementById('user-tasks-container');
  const meetingsContainer = document.getElementById('user-meetings-container');
  const calendarContainer = document.getElementById('user-calendar-container');

  if (tasksContainer) tasksContainer.innerHTML = userTasksHtml();
  if (meetingsContainer) meetingsContainer.innerHTML = userMeetingsHtml();
  if (calendarContainer) {
    const cu = state.currentUser;
    const myTasksAll = scopedTasks();
    const myMeetingsAll = schedules.filter(s=>inMyScope(s.divisi));
    
    // Memetakan tanggal mana saja yang ada Tugas dan Agenda
    const eventMap = {};
    myTasksAll.forEach(t => { 
      if(!t.done) { 
        if(!eventMap[t.deadline]) eventMap[t.deadline] = {}; 
        eventMap[t.deadline].task = true; 
      } 
    });
    myMeetingsAll.forEach(s => { 
      if(s.status !== 'Canceled') { 
        if(!eventMap[s.tanggal]) eventMap[s.tanggal] = {}; 
        eventMap[s.tanggal].schedule = true; 
      } 
    });
    
    calendarContainer.innerHTML = miniCalendarHtml(eventMap, state.selectedDate);
  }
  refreshIcons();
};

   ========================================================================= */
function renderHomeAdmin(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const notDone = total - done;
  const overdue = tasks.filter(t=>getTaskStatus(t)==='Overdue').length;
const pendingExtCount = tasks.filter(t => t.extensions && t.extensions.some(ex => ex.status === 'pending')).length;
  const counts = { 'On Progress':0, 'Due Soon':0, 'Overdue':0, 'Completed Late':0, 'Done':0 };
  tasks.forEach(t => counts[getTaskStatus(t)]++);
  // Perbaiki perhitungan pieData agar tidak ada nilai NaN
  const _pieOrder = ['On Progress','Due Soon','Overdue','Need Revision','Completed Late','Done','Waiting Approval'];
const pieData = _pieOrder.map(n => ({ name: n, value: tasks.filter(t => getTaskStatus(t) === n).length }));

  const _sc = getScopeDivisi();
const divisionStats = getDivisionStats(tasks).filter(d => !_sc || _sc.includes(d.divisi));

return diffDaysDone < 2; // Tampilkan jika belum lewat 3 hari sejak diselesaikan

function getFilteredSchedules(scopeDivisi){
  const f = state.scheduleFilters; let list = schedules;
  if(scopeDivisi) list = list.filter(s => inMyScope(s.divisi) && (!isAsmen(state.currentUser) || iAmIn(s.users)));
  return list.filter(s => {
    if(f.start && s.tanggal < f.start) return false;
    if(f.end && s.tanggal > f.end) return false;
    if(f.minggu && getMonthWeekNumber(new Date(s.tanggal)) !== f.minggu) return false;
    if(f.nama && !s.nama.toLowerCase().includes(f.nama.toLowerCase())) return false;
    if(f.status && s.status !== f.status) return false;
    if(f.divisi && !s.divisi.includes(f.divisi)) return false;
    return true;
  }).sort((a,b)=> a.tanggal<b.tanggal?-1:1);
}


window._hashStr = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return String(h); };

// Buat PDF Uman, unggah ke Cloudinary, kembalikan link publik. Hasil disimpan di browser
// selama isi agenda/tugasnya tidak berubah, jadi ekspor berikutnya cepat dan tidak menumpuk file.
window.getUmanPublicUrl = async function(s) {
  const tl = (window.tasks || []).filter(t => t.scheduleRefId === s.id).map(t => [t.name, t.deadline, t.pic, t.divisi, t.taskNum]);
  const sig = _hashStr(JSON.stringify([s.nama, s.tanggal, s.waktu, s.lokasi, s.zoomLink, s.users, s.hadir, s.notulensi, s.dokumentasi, s.status, tl]));
  const key = 'uman_pdf_' + s.id;
  try {
    const c = JSON.parse(localStorage.getItem(key) || 'null');
    if (c && c.sig === sig && c.url) return c.url;
  } catch (e) {}

  const blob = await window.printUman(s.id, { returnBlob: true });
  if (!blob) return null;
  const fd = new FormData();
  fd.append('file', new File([blob], 'Uman_' + s.id + '.pdf', { type: 'application/pdf' }));
  fd.append('upload_preset', window.CLOUDINARY_PRESET);
  const res = await fetch(window.CLOUDINARY_URL.replace('/image/upload', '/auto/upload'), { method: 'POST', body: fd });
  const data = await res.json();
  if (!data.secure_url) throw new Error((data.error && data.error.message) || 'Upload gagal');
  try { localStorage.setItem(key, JSON.stringify({ sig, url: data.secure_url })); } catch (e) {}
  return data.secure_url;
};

// LOGIKA EXPORT PDF SCHEDULE
window.exportSchedulePDF = async function() {
  const { jsPDF } = window.jspdf;
  const base = window.location.origin + window.location.pathname;
  const list = getFilteredSchedules(state.currentUser.role === 'admin' ? null : state.currentUser.divisi);
  if (!list.length) return alert('Tidak ada agenda untuk diekspor.');

  alert(`Menyiapkan ${list.length} dokumen Uman. Mohon tunggu dan jangan tutup halaman...`);
  const urls = [];
  for (const s of list) {
    try { urls.push(await getUmanPublicUrl(s)); }
    catch (e) { console.error('Uman gagal diunggah:', s.nama, e); urls.push(null); }
  }
  const failed = urls.filter(u => !u).length;

  const doc = new jsPDF('landscape');
  doc.setFontSize(14); doc.text("Laporan Agenda & Notulensi (GASPOL)", 14, 15);
  const data = list.map(s => [
    fmtDate(s.tanggal), s.nama, s.status, s.divisi.join(', '), s.users.join(', '), 'Buka Uman'
  ]);
  doc.autoTable({
    head: [['Tanggal', 'Judul Agenda', 'Status', 'Divisi', 'Peserta', 'Notulensi']],
    body: data, startY: 22, styles: { fontSize: 8 },
    didParseCell: d => {
      if (d.section === 'body' && d.column.index === 5) { d.cell.styles.textColor = [37, 99, 235]; d.cell.styles.fontStyle = 'bold'; }
    },
    didDrawCell: d => {
      if (d.section === 'body' && d.column.index === 5) {
        const i = d.row.index;
        const url = urls[i] || (base + '?uman=' + list[i].id);   // cadangan: link lama jika unggah gagal
        doc.link(d.cell.x, d.cell.y, d.cell.width, d.cell.height, { url });
      }
    }
  });
  doc.save('Laporan_Agenda.pdf');
  if (failed) alert(`${failed} dokumen Uman gagal diunggah. Link-nya memakai cara lama (perlu login).`);
};

/* =========================================================================
   FUNGSI BARU: AUTO-DONE SCHEDULE
   ========================================================================= */
function checkAutoDoneSchedules() {
  const now = new Date();
  
  schedules.forEach(s => {
    // Abaikan jika agenda sudah dibatalkan, di-hold, atau sudah diselesaikan secara manual
    if (s.status === 'Canceled' || s.status === 'Hold' || s.status === 'Done') return;
    
    // Pecah format waktu (contoh: "15:00 - 16:00" atau "15:00 - Selesai")
    const timeParts = s.waktu.split('-');
    const startTimeStr = timeParts[0].trim();
    let endTimeStr = timeParts[1] ? timeParts[1].trim() : '23:59';
    
    // Jika waktu selesai tertulis "Selesai", asumsikan selesai di penghujung hari
    if (endTimeStr.toLowerCase() === 'selesai' || !endTimeStr.includes(':')) {
      endTimeStr = '23:59';
    }

    // Pastikan format jam valid sebelum diproses agar tidak error
    if (!startTimeStr.includes(':')) return;

    // Gabungkan tanggal dan jam menjadi objek Date agar bisa dibandingkan
    const startDateTime = new Date(`${s.tanggal}T${startTimeStr}:00`);
    const endDateTime = new Date(`${s.tanggal}T${endTimeStr}:00`);

    let targetStatus = s.status;

    // LOGIKA PERUBAHAN STATUS BERDASARKAN WAKTU
    if (now < startDateTime) {
      targetStatus = 'Scheduled';
    } else if (now >= startDateTime && now <= endDateTime) {
      targetStatus = 'Live';
    } else if (now > endDateTime) {
      targetStatus = 'Done';
    }

    // Update ke database HANYA JIKA status berubah (Mencegah Infinite Loop)
    if (s.status !== targetStatus) {
      s.status = targetStatus;
      
      if (targetStatus === 'Done') {
        s.doneDate = toISO(today); // Catat tanggal selesainya
      }
      
      // Simpan perubahan ke Firebase secara otomatis
      window.set(window.ref(window.rtdb, "gaspol_schedules/" + s.id), s);
    }
  });
}

function getMonthWeekNumber(d) {
  const date = new Date(d);
  const year = date.getFullYear();
  // Mengambil nama bulan (misal: "Agustus", "September")
  const monthName = date.toLocaleDateString('id-ID', { month: 'long' });
  
  // Logika minggu ke-berapa di bulan tersebut
  const firstDay = new Date(year, date.getMonth(), 1).getDay();
  const dayOfMonth = date.getDate();
  const weekNo = Math.ceil((dayOfMonth + firstDay) / 7);
  
  return `${year} ${monthName} Minggu ke-${weekNo}`;
}

function getCardDateInfo(iso) {
  const d = new Date(iso+'T00:00:00');
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
  return { dayName: days[d.getDay()], dateNum: d.getDate(), monthYear: `${months[d.getMonth()]} ${d.getFullYear()}` };
}

function getFilteredTasks(scopeDivisi){
  const f = state.taskFilters; let list = tasks;
  if(scopeDivisi) list = list.filter(t => inMyScope(t.divisi));
  return list.filter(t => {
    if(f.start && t.deadline < f.start) return false;
    if(f.end && t.deadline > f.end) return false;
    if(f.nama && !t.name.toLowerCase().includes(f.nama.toLowerCase())) return false;
    if(f.status && getTaskStatus(t) !== f.status) return false;
    if(f.divisi && !t.divisi.includes(f.divisi)) return false;
    if(f.pic && !t.pic.includes(f.pic)) return false;
    return true;
  }).sort((a,b)=> a.deadline<b.deadline?-1:1);
}

// LOGIKA EXPORT PDF TASK
window.exportTaskPDF = function() {
  const { jsPDF } = window.jspdf; const doc = new jsPDF('landscape');
  doc.setFontSize(14); doc.text("Laporan Data Tugas (GASPOL)", 14, 15);
  const list = getFilteredTasks(state.currentUser.role === 'admin' ? null : state.currentUser.divisi);
  const fixUrl = u => { u = String(u || '').trim(); if (!u) return ''; return /^https?:\/\//i.test(u) ? u : 'https://' + u; };
  const data = list.map(t => [
    fmtDate(t.inputDate || new Date(parseInt(t.id.substring(1))).toISOString().slice(0, 10)),
    t.name, (t.desc || '').substring(0, 40) + '...', fmtDate(t.deadline), getTaskStatus(t),
    t.divisi.join(', '), t.pic.join(', '),
    fixUrl(t.proofLink) ? 'Buka Hasil' : '-'
  ]);
  doc.autoTable({
    head: [['Tgl Input', 'Judul Tugas', 'Detail', 'Deadline', 'Status', 'Divisi', 'PIC', 'Hasil Submit']],
    body: data, startY: 22, styles: { fontSize: 8 },
    columnStyles: { 7: { cellWidth: 22, halign: 'center' } },
    didParseCell: d => {
      if (d.section === 'body' && d.column.index === 7 && fixUrl(list[d.row.index].proofLink)) {
        d.cell.styles.textColor = [37, 99, 235]; d.cell.styles.fontStyle = 'bold';
      }
    },
    didDrawCell: d => {
      if (d.section === 'body' && d.column.index === 7) {
        const url = fixUrl(list[d.row.index].proofLink);
        if (url) doc.link(d.cell.x, d.cell.y, d.cell.width, d.cell.height, { url });
      }
    }
  });
  doc.save('Laporan_Task.pdf');
}

   FUNGSI QUICK TASK (TUGAS TURUNAN DARI NOTULENSI)

let currentSelectedRange = null;
let currentSelectedText = '';

window.saveNotulensiDraft = function(key) {
  const editor = document.getElementById('notulensi-editor');
  if(editor) localStorage.setItem(key, editor.innerHTML);
  document.getElementById('floating-task-btn').style.display = 'none';
};

window.checkTextSelection = function() {
  if (isLiteAdmin()) return;
  const editor = document.getElementById('notulensi-editor');
  const btn = document.getElementById('floating-task-btn');
  if(!editor || !btn) return;
  
  const sel = window.getSelection();
  if(sel.rangeCount > 0 && !sel.isCollapsed) {
    const range = sel.getRangeAt(0);
    if(editor.contains(range.commonAncestorContainer)) {
      currentSelectedText = sel.toString().trim();
      if(currentSelectedText.length > 0) {
        currentSelectedRange = range;
        btn.style.top = '10px'; 
        btn.style.right = '10px';
        btn.style.display = 'flex';
        return;
      }
    }
  }
  btn.style.display = 'none';
};

window.createTaskFromSelection = function() {
  if (isLiteAdmin()) return;
  if(!currentSelectedRange || !currentSelectedText) return;
  
  // --- LOGIKA BARU: Cari angka terkecil yang "bolong" / belum dipakai ---
  const editor = document.getElementById('notulensi-editor');
  // Membaca langsung angka berapa saja yang sedang tampil di layar saat ini
  const existingBadges = editor.querySelectorAll('span[data-temp-id] > span.bg-evergreen-dark');
  const usedNumbers = Array.from(existingBadges).map(b => parseInt(b.textContent) || 0);
  
  // Looping untuk mencari angka paling awal yang tersedia
  let nextNum = 1;
  while (usedNumbers.includes(nextNum)) {
    nextNum++;
  }
  // ---------------------------------------------------------------------
  
  const tempId = 'qt-' + Date.now();
  const span = document.createElement('span');
  
  span.className = 'bg-evergreen-light/50 text-evergreen-dark font-bold pr-1.5 py-0.5 mx-0.5 rounded cursor-pointer border border-evergreen-light hover:bg-evergreen transition-colors shadow-sm';
  span.setAttribute('data-temp-id', tempId);
  span.setAttribute('data-original-text', currentSelectedText); 
  span.setAttribute('onclick', `editTempTask('${tempId}')`);
  
  // Memasukkan angka nextNum yang sudah dikalkulasi
  span.innerHTML = `<span contenteditable="false" class="inline-flex items-center justify-center bg-evergreen-dark text-white rounded-full min-w-[16px] h-4 text-[9px] mx-1 shadow-sm leading-none">${nextNum}</span><span>${esc(currentSelectedText)}</span>`;

  currentSelectedRange.deleteContents();
  currentSelectedRange.insertNode(span);
  
  window.getSelection().removeAllRanges();
  document.getElementById('floating-task-btn').style.display = 'none';
  
  state.tempTasks.unshift({ id: tempId, taskNum: nextNum, name: currentSelectedText, deadline: '', divisi: [], pic: [] });
  saveNotulensiDraft('gaspol_draft_' + state.modal.payload.schedule.id);
  editTempTask(tempId);
};
