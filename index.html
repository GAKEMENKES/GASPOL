// FITUR BARU: Hapus tugas dan kembalikan teks normal di editor
window.deleteTempTask = function(id) {
  // A. Cari span yang sesuai dengan ID tugas
  const span = document.querySelector(`span[data-temp-id="${id}"]`);
  if (span) {
    // B. Ambil teks aslinya dan ganti elemen span menjadi teks biasa (hilangkan highlight)
    const originalText = span.getAttribute('data-original-text');
    const textNode = document.createTextNode(originalText);
    span.parentNode.replaceChild(textNode, span);
    
    // C. Simpan draf terbaru agar highlight yang dihapus tidak kembali saat di-refresh
    saveNotulensiDraft('gaspol_draft_' + state.modal.payload.schedule.id);
  }
  
  // D. Hapus data dari array panel tugas kanan
  state.tempTasks = state.tempTasks.filter(t => t.id !== id);
  renderRightPanel();
};

window.updateTempTask = function(id, field, value) {
  const t = state.tempTasks.find(x => x.id === id);
  if(t) t[field] = value;
  renderRightPanel();
};

window.updateTempDivisi = function(id, div, isChecked) {
  const t = state.tempTasks.find(x => x.id === id);
  if(!t) return;
  if(isChecked) { t.divisi.push(div); } else { t.divisi = t.divisi.filter(d => d !== div); }
  
  if(isChecked) {
    const users = USERS.filter(u => u.divisi === div);
    users.forEach(u => { if(!t.pic.includes(u.name)) t.pic.push(u.name); });
  }
  renderRightPanel();
};

  resContainer.innerHTML = matches.map(u => `

};

  const t = state.tempTasks.find(x => x.id === taskId);

};

window.removeTempPic = function(taskId, picName) {

};

window.handleUploadDokumentasi = async function(input, scheduleId) {
  if(input.files && input.files[0]) {
    const s = schedules.find(x => x.id === scheduleId);
    if(!s.dokumentasi) s.dokumentasi = [];
    if(s.dokumentasi.length >= 2) return alert('Maksimal hanya 2 foto!');

    alert("Mengompres dan mengupload gambar...");
    
    try {
      // Kompres foto sebelum dikirim
      const compressedFile = await window.compressImage(input.files[0], 1280, 1280, 0.7);
      
      const formData = new FormData();
      formData.append("file", compressedFile);
      formData.append("upload_preset", window.CLOUDINARY_PRESET);

      const res = await fetch(window.CLOUDINARY_URL, { method: "POST", body: formData });
      const data = await res.json();
      if(data.secure_url) {
        // --- SISIPKAN KODE INI ---
        let optimizedUrl = data.secure_url;
        if (optimizedUrl.includes('/upload/')) {
            optimizedUrl = optimizedUrl.replace('/upload/', '/upload/f_auto,q_auto/');
        }
        // -------------------------

        s.dokumentasi.push(optimizedUrl);
        await window.set(window.ref(window.rtdb, "gaspol_schedules/" + s.id), s);
      }
    } catch (err) {
      console.error(err);
      alert("Gagal mengupload gambar.");
    }
  }
};

window.hapusDokumentasi = async function(scheduleId, index) {
  const s = schedules.find(x => x.id === scheduleId);
  if(s && s.dokumentasi) {
    s.dokumentasi.splice(index, 1);
    await window.set(window.ref(window.rtdb, "gaspol_schedules/" + s.id), s);
    openModal("dokumentasi", s); 
  }
};

window.downloadCSV = async function(type) {
  const monthVal = document.getElementById('export-month').value;
    const divisiVal = (document.getElementById('export-divisi') || {}).value || '';
  const statusVal = (document.getElementById('export-status') || {}).value || '';
  
  if (!monthVal) return openModal('alert', { title: 'Peringatan', msg: 'Pilih bulan terlebih dahulu!' });

  try {
    let csvContent = "";
    const currentDomain = window.location.origin + window.location.pathname;

    if (type === 'agenda') {
      const snap = await window.get(window.child(window.ref(window.rtdb), "gaspol_schedules"));
      csvContent += "Tgl Input,Nama Agenda,Tanggal Agenda,Divisi Hadir,Peserta Hadir,Notulensi Agenda,Foto Dokumentasi 1,Foto Dokumentasi 2,Status\n";
      
      if (snap.exists()) {
        const data = snap.val();
        for (let key in data) {
          const s = data[key];
          if (s.tanggal && s.tanggal.startsWith(monthVal)) {
            if (divisiVal && (!s.divisi || !s.divisi.includes(divisiVal))) continue;
            
            const isDone = s.status === 'Done';
            if (statusVal === 'Done' && !isDone) continue;
            if (statusVal === 'Pending' && isDone) continue;

            const inputDate = s.inputDate ? fmtDate(s.inputDate) : '-';
            const divStr = s.divisi ? s.divisi.join(' | ') : '';
            const usrStr = s.users ? s.users.join(' | ') : '';
            const notulensiLink = s.notulensi ? `${currentDomain}?viewNotulensi=${s.id}` : 'Belum Ada';
            const foto1 = (s.dokumentasi && s.dokumentasi[0]) ? s.dokumentasi[0] : '-';
            const foto2 = (s.dokumentasi && s.dokumentasi[1]) ? s.dokumentasi[1] : '-';

            csvContent += `"${inputDate}","${escCSV(s.nama)}","${s.tanggal}","${divStr}","${usrStr}","${notulensiLink}","${foto1}","${foto2}","${s.status}"\n`;
          }
        }
      }
    } else if (type === 'task') {
      const snap = await window.get(window.child(window.ref(window.rtdb), "gaspol_tasks"));
      csvContent += "Tgl Input,Nama Tugas,Detail Tugas,Link Referensi,Deadline,Divisi,PIC,Keterangan Progres,Hambatan,Output (Bukti Kerja),Status\n";

      if (snap.exists()) {
        const data = snap.val();
        for (let key in data) {
          const t = data[key];
          const tDate = t.inputDate || t.deadline; 
          if (tDate && tDate.startsWith(monthVal)) {
            if (divisiVal && (!t.divisi || !t.divisi.includes(divisiVal))) continue;
            
            if (statusVal === 'Done' && !t.done) continue;
            if (statusVal === 'Pending' && t.done) continue;

            const inputDate = t.inputDate ? fmtDate(t.inputDate) : '-';
            const divStr = t.divisi ? t.divisi.join(' | ') : '';
            const picStr = t.pic ? t.pic.join(' | ') : '';
            const status = t.done ? 'Done' : 'Belum Selesai';

            csvContent += `"${inputDate}","${escCSV(t.name)}","${escCSV(t.desc)}","${t.taskLink || '-'}","${t.deadline}","${divStr}","${picStr}","${escCSV(t.progressDetail)}","${escCSV(t.obstacle)}","${t.proofLink || '-'}","${status}"\n`;
          }
        }
      }
    }

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `GASPOL_Export_${type}_${monthVal}.csv`;
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  } catch (err) {
    openModal('alert', { title: 'Error', msg: 'Gagal menarik data dari server.' });
  }
};

window.BACKUP_RETENTION_DAYS = 14;

// Backup otomatis harian (dipanggil tiap admin login)
window.autoBackupCheck = async function() {
  if (!state.currentUser || state.currentUser.role !== 'admin') return;
  const todayKey = toISO(today);
  try {
    const checkSnap = await window.get(window.child(window.ref(window.rtdb), "gaspol_backups/" + todayKey));
    if (checkSnap.exists()) return; // sudah ada backup hari ini

    const [tSnap, sSnap, uSnap] = await Promise.all([
      window.get(window.child(window.ref(window.rtdb), "gaspol_tasks")),
      window.get(window.child(window.ref(window.rtdb), "gaspol_schedules")),
      window.get(window.child(window.ref(window.rtdb), "gaspol_users"))
    ]);

    const snapshot = {
      timestamp: new Date().toISOString(),
      tasks: tSnap.exists() ? tSnap.val() : {},
      schedules: sSnap.exists() ? sSnap.val() : {},
      users: uSnap.exists() ? uSnap.val() : {}
    };
    await window.set(window.ref(window.rtdb, "gaspol_backups/" + todayKey), snapshot);

    // Hapus backup lama melebihi masa retensi
    const allSnap = await window.get(window.child(window.ref(window.rtdb), "gaspol_backups"));
    if (allSnap.exists()) {
      const keys = Object.keys(allSnap.val()).sort();
      if (keys.length > window.BACKUP_RETENTION_DAYS) {
        const toDelete = keys.slice(0, keys.length - window.BACKUP_RETENTION_DAYS);
        for (const k of toDelete) await window.remove(window.ref(window.rtdb, "gaspol_backups/" + k));
      }
    }
  } catch (err) { console.error("Auto-backup gagal:", err); }
};

window.restoreFromBackupFile = function(input) {
  const file = input.files[0];
  if (!file) return;
  
  if (!file.name.endsWith('.json')) {
    openModal('alert', { title: 'Format Salah', msg: 'File yang Anda pilih bukan berformat .json. Pastikan Anda tidak salah memilih file CSV (hasil Export).' });
    input.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.tasks && !data.schedules && !data.exportedAt) throw new Error("Struktur JSON salah");
      openModal('confirmRestore', data);
    } catch (err) {
      openModal('alert', { title: 'File Rusak', msg: 'File backup tidak valid atau rusak (Corrupt). Pastikan file JSON tidak pernah dimodifikasi secara manual.' });
    }
  };
  reader.readAsText(file);
  input.value = '';
};

window.checkBackupReminder = async function() {
  if (!state.currentUser || state.currentUser.role !== 'admin') return;
  if (state.backupReminderDismissed) return; // sudah ditutup di sesi ini

  const anchor = document.getElementById('backup-reminder-anchor');
  if (!anchor) return;

  try {
    const snap = await window.get(window.child(window.ref(window.rtdb), "gaspol_meta/lastManualBackupDownload"));
    let daysSince = null;
    let lastInfo = null;

    if (snap.exists()) {
      lastInfo = snap.val();
      const lastDate = new Date(lastInfo.date + 'T00:00:00');
      daysSince = Math.round((today - lastDate) / 86400000);
    }

    const neverBackedUp = !snap.exists();
    const isOverdue = neverBackedUp || daysSince >= window.BACKUP_REMINDER_THRESHOLD_DAYS;

    if (!isOverdue) { anchor.innerHTML = ''; return; }

    const message = neverBackedUp
      ? 'Belum pernah ada backup manual yang diunduh untuk data GASPOL.'
      : `Sudah <b>${daysSince} hari</b> sejak backup manual terakhir diunduh (${fmtDate(lastInfo.date)} oleh ${esc(lastInfo.by)}).`;

        </div>
        <div class="flex gap-2 shrink-0 w-full sm:w-auto">
          <button onclick="dismissBackupReminder()" class="btn-ghost text-xs px-3 py-2 flex-1 sm:flex-none justify-center">Nanti Saja</button>
          <button onclick="downloadFullBackupJSON()" class="px-4 py-2 rounded-xl bg-amber-500 text-white text-xs font-bold hover:bg-amber-600 transition-all shadow-sm flex-1 sm:flex-none flex items-center justify-center gap-1.5">${icon('download', 'w-3.5 h-3.5')} Unduh Sekarang</button>

  } catch (err) {
    console.error('Gagal cek pengingat backup:', err);
  }

window.downloadSingleBackup = async function(weekKey) {
  if (!state.currentUser || state.currentUser.role !== 'admin') return;
  const snap = await window.get(window.child(window.ref(window.rtdb), "gaspol_backups/" + weekKey));
  if (!snap.exists()) return alert('Backup tidak ditemukan.');
  const backupData = snap.val();

  const backupDate = backupData.timestamp ? new Date(backupData.timestamp) : new Date();
  const monthName = getMonthNameID(backupDate);
  const yearBackup = backupDate.getFullYear();
  const weekLabel = getWeekOfMonth(backupDate); // hasilnya 1, 2, 3, atau 4

  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Backup Data ${monthName} ${yearBackup} (Minggu ke-${weekLabel}).json`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
};

/* ===== REKAP (WhatsApp) ===== */
const isoL = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
window.rekapState = window.rekapState || { type: 'agenda', mode: 'harian', date: isoL(new Date()) };
window.setRekap = function(k, v) {
  window.rekapState[k] = v;
  window._rekapForce = true; renderTabContent(); window._rekapForce = false;
};

function rekapRange(mode, refISO) {
  const p = refISO.split('-').map(Number);
  let a = new Date(p[0], p[1]-1, p[2]), b = new Date(a);
  if (mode === 'mingguan') { a.setDate(a.getDate() - ((a.getDay() + 6) % 7)); b = new Date(a); b.setDate(b.getDate() + 6); }
  if (mode === 'bulanan')  { a = new Date(p[0], p[1]-1, 1); b = new Date(p[0], p[1], 0); }
  return { a, b };
}

window.generateRekap = async function() {
  const st = window.rekapState, out = document.getElementById('rekap-output'), info = document.getElementById('rekap-info');
  if (!out) return;
  out.value = 'Memuat data...';
  const { a, b } = rekapRange(st.mode, st.date);
  const from = isoL(a), to = isoL(b);
  const L = iso => new Date(iso + 'T00:00:00').toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const cn = name => { const u = (window.USERS || []).find(x => x.name === name); return (u && u.codename) ? u.codename : name; };
  const periode = st.mode === 'harian' ? L(from)
    : st.mode === 'mingguan' ? `${L(from)} s.d. ${L(to)}`
    : a.toLocaleDateString('id-ID', { month:'long', year:'numeric' });
  const label = { harian:'HARIAN', mingguan:'MINGGUAN', bulanan:'BULANAN' }[st.mode];

  try {
    let text = '', count = 0;
    if (st.type === 'agenda') {
      const snap = await window.get(window.child(window.ref(window.rtdb), 'gaspol_schedules'));
      const items = (snap.exists() ? Object.values(snap.val()) : [])
        .filter(s => s.tanggal >= from && s.tanggal <= to && s.status !== 'Hold')
        .sort((x, y) => (x.tanggal + x.waktu) < (y.tanggal + y.waktu) ? -1 : 1);
      count = items.length;
      text = `*REKAP AGENDA ${label}*\n${periode}\n`;
      if (!items.length) text += '\n_Tidak ada agenda pada periode ini._';
      items.forEach((s, i) => {
        const mark = s.status === 'Done' ? '✅ ' : (s.status === 'Canceled' ? '❌ ' : '');
       const peserta = isAllLeader(s) ? 'All Leader' : (s.users || []).map(cn).join(', ');
        text += `\n${i+1}.*${s.nama}* ${mark}\n`
          + `📅 ${L(s.tanggal)}\n`
          + `🕐 ${s.waktu} WIB\n`
          + `📍 ${s.lokasi || '-'}\n`
          + (s.zoomLink ? `🎥 Zoom: ${s.zoomLink}\n` : '')
          + `🔗 Link Materi: ${s.refLink || '-'}\n`
          + `👥 Peserta: ${peserta || '-'}\n`;
      });
    } else {
      const snap = await window.get(window.child(window.ref(window.rtdb), 'gaspol_tasks'));
      const items = (snap.exists() ? Object.values(snap.val()) : [])
        .filter(t => t.deadline >= from && t.deadline <= to)
        .sort((x, y) => x.deadline < y.deadline ? -1 : 1);
      count = items.length;
      text = `*REKAP TUGAS ${label}*\n${periode}\n`;
      if (!items.length) text += '\n_Tidak ada tugas dengan deadline pada periode ini._';
      items.forEach((t, i) => {
        text += `\n${i+1}. ${t.done ? '✅ ' : ''}*${t.name}*\n`
          + `⏰ Deadline: ${L(t.deadline)}${t.deadlineTime ? ', ' + t.deadlineTime + ' WIB' : ''}\n`
          + `🔗 ${t.taskLink || '-'}\n`
          + `👤 PIC: ${(t.pic || []).map(cn).join(', ') || '-'}\n`;
      });
    }
    out.value = text.trim();
    if (info) info.textContent = `${from} s.d. ${to}  •  ${count} ${st.type === 'agenda' ? 'agenda' : 'tugas'}`;
  } catch (err) { console.error(err); out.value = 'Gagal memuat data dari server.'; }
};

window.copyRekap = async function() {
  const ta = document.getElementById('rekap-output');

  try { await navigator.clipboard.writeText(ta.value); }

};

// FUNGSI FETCH ARSIP DENGAN FILTER DIVISI & FLEKSIBEL
window.fetchArchivedData = async function() {
  const startDate = document.getElementById('archive-start-date').value;
  const endDate = document.getElementById('archive-end-date').value;
  const keyword = document.getElementById('archive-keyword').value.trim().toLowerCase();
  const selectedDivisi = document.getElementById('archive-divisi') ? document.getElementById('archive-divisi').value : '';

  const schedContainer = document.getElementById('archived-schedules-list');
  const taskContainer = document.getElementById('archived-tasks-list');
  const countScheds = document.getElementById('count-scheds');
  const countTasks = document.getElementById('count-tasks');

  schedContainer.innerHTML = `<div class="text-center py-8 text-gray-400">Mencari data arsip...</div>`;
  taskContainer.innerHTML = `<div class="text-center py-8 text-gray-400">Mencari data arsip...</div>`;

  const cu = state.currentUser;
  const isAdmin = cu.role === 'admin';

  try {
    // 1. Tarik & Filter Arsip Agenda
    const schedSnap = await window.get(window.child(window.ref(window.rtdb), "gaspol_schedules"));
    let archivedScheds = [];
    if (schedSnap.exists()) {
      const data = schedSnap.val();
      Object.keys(data).forEach(k => {
        const s = data[k];
        
        // Cek apakah masuk kategori arsip ATAU statusnya sudah Done/Canceled (agar data yang baru selesai tetap bisa ditemukan saat difilter)
        const isActuallyArchived = s.isArchived || s.status === 'Done' || s.status === 'Canceled';
        if (!isActuallyArchived) return;

        // Filter hak akses divisi jika bukan admin
        if (!isAdmin && !s.divisi.includes(cu.divisi)) return;
        if (isAsmen(cu) && !iAmIn(s.users)) return;
        // Filter pilihan dropdown divisi (jika admin memilih divisi tertentu)
        const sc = getScopeDivisi();
if (sc && !(s.divisi || []).some(d => sc.includes(d))) return;
        if (isAdmin && selectedDivisi && !s.divisi.includes(selectedDivisi)) return;

        // Filter Tanggal
        if (startDate && s.tanggal < startDate) return;
        if (endDate && s.tanggal > endDate) return;

        // Filter Kata Kunci Nama
        if (keyword && !s.nama.toLowerCase().includes(keyword)) return;

        archivedScheds.push(s);
      });
    }

    countScheds.textContent = `${archivedScheds.length} ditemukan`;
        window._archivedSchedCache = {};
    archivedScheds.forEach(s => { window._archivedSchedCache[s.id] = s; });
    if (archivedScheds.length === 0) {
      schedContainer.innerHTML = `<p class="text-sm text-gray-400 py-6 text-center bg-gray-50 rounded-2xl">Tidak ada arsip agenda yang sesuai.</p>`;
    } else {
      schedContainer.innerHTML = archivedScheds.map(s => `
        <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-200 rounded-2xl hover:border-evergreen transition-all">
          <div>
            <p class="text-sm font-bold text-gray-900">${s.nama}</p>
            <p class="text-xs text-gray-500 mt-1">${fmtDate(s.tanggal)} • ${s.waktu} • Divisi: ${s.divisi.join(', ')}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick='printUman("${s.id}")' class="px-5 py-2.5 rounded-xl bg-gray-900 text-white hover:bg-black text-sm font-bold transition-all flex items-center justify-center gap-2 shadow-sm active:scale-95">
            ${icon('printer', 'w-4 h-4')} Uman
            </button>
          </div>
        </div>
      `).join('');
    }

    // 2. Tarik & Filter Arsip Tugas
    const taskSnap = await window.get(window.child(window.ref(window.rtdb), "gaspol_tasks"));
    let archivedTasks = [];
    if (taskSnap.exists()) {
      const data = taskSnap.val();
      Object.keys(data).forEach(k => {
        const t = data[k];
        
        // Cek apakah masuk arsip atau sudah selesai (memastikan tugas stiker yang baru selesai bisa langsung tampil)
        const isActuallyArchived = t.isArchived || t.done;
        if (!isActuallyArchived) return;

        // Filter hak akses divisi jika bukan admin
        if (!isAdmin && !t.divisi.includes(cu.divisi)) return;
        // Filter dropdown divisi admin
        const sc = getScopeDivisi();
if (sc && !(t.divisi || []).some(d => sc.includes(d))) return;
        if (isAdmin && selectedDivisi && !t.divisi.includes(selectedDivisi)) return;

        // Filter Tanggal Deadline
        if (startDate && t.deadline < startDate) return;
        if (endDate && t.deadline > endDate) return;

        // Filter Kata Kunci Nama / Deskripsi
        if (keyword && !t.name.toLowerCase().includes(keyword) && !t.desc.toLowerCase().includes(keyword)) return;

        archivedTasks.push(t);
      });
    }

    countTasks.textContent = `${archivedTasks.length} ditemukan`;
    if (archivedTasks.length === 0) {
      taskContainer.innerHTML = `<p class="text-sm text-gray-400 py-6 text-center bg-gray-50 rounded-2xl">Tidak ada arsip tugas yang sesuai.</p>`;
    } else {
      taskContainer.innerHTML = archivedTasks.map(t => `
        <div class="flex items-center justify-between p-4 bg-gray-50 border border-gray-200 rounded-2xl hover:border-evergreen transition-all">
          <div>
            <p class="text-sm font-bold text-gray-900">${t.name}</p>
            <p class="text-xs text-gray-500 mt-1">Deadline: ${fmtDate(t.deadline)} • Divisi: ${t.divisi.join(', ')} • PIC: ${t.pic ? t.pic.join(', ') : '-'}</p>
          </div>
          <button onclick='openModal("taskDetail", ${JSON.stringify(t).replace(/'/g, "&apos;")})' class="px-3 py-1.5 rounded-xl bg-gray-200 text-gray-700 font-bold text-xs hover:bg-gray-300 transition-all flex items-center gap-1.5 shadow-sm">
            ${icon('eye', 'w-3.5 h-3.5')} Lihat Hasil &amp; Progres
          </button>
        </div>
      `).join('');
    }
    refreshIcons();
  } catch (err) {
    console.error("Gagal memuat arsip:", err);
    alert("Gagal mengambil data arsip dari server.");
  }
};
